*{box-sizing:border-box}html,body,#app{min-height:100%;margin:0}body{background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit;color:inherit}a{color:var(--brand)}button{cursor:pointer}.top{height:60px;display:flex;align-items:center;gap:10px;padding:0 16px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20}.brand{font-size:20px;font-weight:900;background:linear-gradient(135deg,var(--brand),var(--brand2));color:transparent;background-clip:text}.spacer{flex:1}.shell{display:flex;min-height:calc(100vh - 60px)}.side{width:245px;background:var(--surface);border-right:1px solid var(--border);padding:12px;overflow:auto}.side button{width:100%;border:0;background:transparent;text-align:left;padding:10px;border-radius:10px;color:var(--muted);font-weight:700;margin:2px 0}.side button:hover,.side button.active{background:var(--surface2);color:var(--brand)}.main{flex:1;padding:22px;min-width:0;overflow:auto}.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}@media(max-width:900px){.side{display:none}.g4,.g3,.g2{grid-template-columns:1fr 1fr}.mobile-nav{display:flex!important}}@media(max-width:560px){.main{padding:14px}.g4,.g3,.g2{grid-template-columns:1fr}.top{padding:0 10px}.mobile-nav{gap:2px}}.mobile-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);z-index:30;justify-content:space-around;padding:5px}.mobile-nav button{background:transparent;border:0;padding:7px;font-size:11px;color:var(--muted)}.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:17px;box-shadow:var(--shadow);margin-bottom:14px}.stat .n{font-size:28px;font-weight:900}.stat .l{font-size:12px;color:var(--muted);margin-top:4px}.btn{border:0;border-radius:10px;padding:10px 15px;background:var(--brand);color:#fff;font-weight:800}.btn.secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border)}.btn.danger{background:var(--bad)}.btn.ok{background:var(--ok)}.btn.sm{padding:7px 10px;font-size:12px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.between{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.field{margin-bottom:12px}.field label{display:block;font-size:12px;color:var(--muted);font-weight:800;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:10px 11px;border:1px solid var(--border);border-radius:10px;background:var(--surface);outline:0}.field textarea{min-height:90px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(67,56,202,.12)}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:9px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}th{font-size:11px;color:var(--muted);text-transform:uppercase}.table{overflow:auto}.badge{display:inline-block;border-radius:99px;padding:4px 9px;font-size:10px;font-weight:900}.pending{background:#fff7ed;color:var(--warn)}.active,.approved,.paid,.locked{background:#ecfdf5;color:var(--ok)}.rejected,.suspended,.expired{background:#fef2f2;color:var(--bad)}.submitted{background:#eff6ff;color:var(--info)}.draft{background:var(--surface2);color:var(--muted)}.notice{padding:11px;border-radius:10px;background:var(--surface2);color:var(--muted);font-size:13px}.empty{text-align:center;padding:38px;color:var(--muted)}.modal-bg{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:15px;z-index:100}.modal{background:var(--surface);border-radius:16px;padding:20px;width:min(700px,100%);max-height:90vh;overflow:auto}.toast{position:fixed;right:15px;bottom:15px;z-index:200;background:#111827;color:#fff;padding:12px 15px;border-radius:10px;max-width:360px}.auth{min-height:100vh;display:grid;place-items:center;padding:18px}.auth .card{width:min(440px,100%)}.hero{text-align:center;padding:22px}.hero h1{font-size:42px;margin:8px 0}.muted{color:var(--muted)}.danger-text{color:var(--bad)}.success-text{color:var(--ok)}.report{background:#fff;color:#111;padding:28px;max-width:800px;margin:auto}.report-head{display:flex;gap:15px;align-items:center;border-bottom:4px solid var(--rc,#4338ca);padding-bottom:12px}.report-head img{width:70px;height:70px;object-fit:contain}.report table th,.report table td{border:1px solid #bbb}.report table th{background:#f3f3f3;color:#222}.sigs{display:flex;justify-content:space-between;gap:20px;margin-top:35px}.sig{text-align:center;flex:1}.sig img{max-width:150px;height:45px;object-fit:contain}.sigline{border-top:1px solid #333;padding-top:4px;margin-top:22px;font-size:11px}@media print{body>*:not(#printHost){display:none!important}#printHost{display:block!important}.report{box-shadow:none;max-width:none}@page{size:A4;margin:0}}

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
import{getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,signOut,sendPasswordResetEmail,updateProfile}from"https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
import{getFirestore,doc,getDoc,getDocs,setDoc,addDoc,updateDoc,deleteDoc,collection,query,where,orderBy,limit,serverTimestamp,writeBatch}from"https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyB-f85f6GRZd6XT8FhuklN6onzoAaDeceY",authDomain:"report-x-fd97e.firebaseapp.com",projectId:"report-x-fd97e",storageBucket:"report-x-fd97e.firebasestorage.app",messagingSenderId:"328964980773",appId:"1:328964980773:web:b688965d85e4b95ffb3fcc",measurementId:"G-FTCVFSMM4J"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);const A="wisdomebubedaniel2009@gmail.com";
const $=s=>document.querySelector(s),C=n=>collection(db,n),D=(n,id)=>doc(db,n,id);const st={u:null,pa:null,ms:[],sid:null,school:null,mem:null,route:"home",params:{},theme:localStorage.rxTheme||"system"};
const labels={owner:"Owner",principal:"Principal",vicePrincipal:"Vice Principal",registrar:"Registrar",teacher:"Teacher",printer:"Printer",parent:"Parent",superAdmin:"Super Admin",supportAdmin:"Support Admin"};
function toast(x){const t=$("#toast");t.textContent=x;t.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display="none",3500)}
function esc(x){return String(x??"").replace(/[&<>\"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[m]))}function role(){return st.pa?(st.pa.level==="super"?"superAdmin":"supportAdmin"):st.mem?.role}function isAcad(){return ["principal","vicePrincipal"].includes(role())}function isAdmin(){return ["owner","principal"].includes(role())||st.mem?.isOwner===true}function can(r){if(role()==="superAdmin")return true;return({students:["registrar","principal","vicePrincipal","owner"],classes:["registrar","principal","vicePrincipal","owner"],academics:["principal","vicePrincipal"],staff:["owner","principal"],brand:["owner","principal"],review:["principal","vicePrincipal"],print:["printer","principal","vicePrincipal","owner"],payment:["owner","principal"],platform:["superAdmin"]}[r]||[]).includes(role())}
function date(x){if(!x)return"—";const d=x.toDate?x.toDate():new Date(x);return d.toLocaleDateString()}function badge(x){return `<span class="badge ${String(x||"").toLowerCase()}">${esc(x||"—")}</span>`}function rid(){return crypto.randomUUID?crypto.randomUUID():Date.now()+""+Math.random()}function code(){const a="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";return"RX-"+Array.from({length:6},()=>a[Math.floor(Math.random()*a.length)]).join("")}
function E(tag,attrs={},html=""){const e=document.createElement(tag);Object.entries(attrs).forEach(([k,v])=>{if(k.startsWith("on"))e.addEventListener(k.slice(2),v);else if(k==="class")e.className=v;else e.setAttribute(k,v)});e.innerHTML=html;return e}
async function audit(action,extra={}){try{await addDoc(C("auditLogs"),{actorUid:st.u?.uid||null,actorRole:role(),schoolId:st.sid||extra.schoolId||null,action,...extra,createdAt:serverTimestamp()})}catch(e){console.warn(e)}}
async function notify(uid,title,body,link=""){try{await addDoc(C("notifications"),{recipientUid:uid,schoolId:st.sid||null,title,body,link,read:false,createdAt:serverTimestamp()})}catch(e){}}
function theme(){const dark=st.theme==="dark"||(st.theme==="system"&&matchMedia("(prefers-color-scheme:dark)").matches);document.documentElement.dataset.theme=dark?"dark":"light"}theme();
function nav(r,p={}){st.route=r;st.params=p;location.hash=r;render()}
function shell(title,body,items){const navs=items.map(([r,i,t])=>`<button class="${st.route===r?"active":""}" data-r="${r}">${i} ${t}</button>`).join("");return `<header class="top"><b class="brand">Report X</b><span class="spacer"></span><span class="muted">${esc(st.school?.name||labels[role()]||"")}</span><button class="btn secondary sm" id="theme">☾</button><button class="btn secondary sm" id="logout">Sign out</button></header><div class="shell"><aside class="side">${navs}</aside><main class="main"><div class="between"><div><h2>${esc(title)}</h2><p class="muted">${esc(labels[role()]||"")}</p></div></div>${body}</main></div><nav class="mobile-nav">${items.slice(0,5).map(([r,i,t])=>`<button data-r="${r}">${i}<br>${esc(t)}</button>`).join("")}</nav>`}
function bind(){document.querySelectorAll("[data-r]").forEach(x=>x.onclick=()=>nav(x.dataset.r));$("#logout")?.addEventListener("click",()=>signOut(auth));$("#theme")?.addEventListener("click",()=>{st.theme=st.theme==="dark"?"light":"dark";localStorage.rxTheme=st.theme;theme()})}
function field(label,type="text",value="",extra=""){return`<div class="field"><label>${esc(label)}</label><input type="${type}" value="${esc(value)}" ${extra}></div>`}function sel(label,opts,value=""){return`<div class="field"><label>${esc(label)}</label><select id="f_${label.replace(/\W/g,"")}">${opts.map(o=>`<option value="${esc(o[0])}" ${o[0]===value?"selected":""}>${esc(o[1])}</option>`).join("")}</select></div>`}
function modal(title,body,save){const b=E("div",{class:"modal-bg"},`<div class="modal"><div class="between"><h3>${esc(title)}</h3><button class="btn secondary sm" id="mc">Close</button></div>${body}<div class="row" style="justify-content:flex-end;margin-top:15px"><button class="btn" id="ms">${esc(save||"Save")}</button></div></div>`);document.body.appendChild(b);$("#mc",b)?.addEventListener("click",()=>b.remove());return b}
function closeModal(){document.querySelector(".modal-bg")?.remove()}
function authView(){return`<div class="auth"><div class="card"><div class="hero"><div class="brand">Report X</div><h1>School results, simplified.</h1><p>Secure report cards, academic workflows and parent access.</p></div><div id="authBox"></div></div></div>`}
function loginBox(){return`<h3>Sign in</h3>${field("Email","email")} ${field("Password","password")}<button class="btn" id="login" style="width:100%">Sign in</button><div class="between" style="margin-top:12px"><a href="#" id="forgot">Forgot password?</a><a href="#" id="register">Register school</a></div><p style="margin-top:14px"><a href="#" id="join">Have a school invite code?</a></p>`}
function joinBox(){return`<h3>Join a school</h3><p class="muted">Create/sign in to your Firebase account first, then redeem the code supplied by the school administrator.</p>${field("School invite code")}<div class="row"><button class="btn" id="redeem">Redeem code</button><button class="btn secondary" id="backLogin">Back</button></div>`}
function registerBox(){return`<h3>Register your school</h3><p class="muted">Create the owner account first. Super Admin approval is required before the school becomes active.</p>${field("Owner name")} ${field("Owner email","email")} ${field("Password","password")} ${field("School name")} ${field("School email","email")} ${field("Phone","tel")} ${field("Address")} ${field("School type")} ${field("Motto")} ${field("Website","url")}<div class="row"><button class="btn" id="registerGo">Submit registration</button><button class="btn secondary" id="backLogin">Back</button></div>`}
function authEvents(mode){if(mode==="login"){$("#login").onclick=async()=>{const i=document.querySelectorAll(".authBox input")};}
}
async function showAuth(mode="login"){const box=$("#authBox");box.innerHTML=mode==="login"?loginBox():mode==="join"?joinBox():registerBox();if(mode==="login"){$("#login").onclick=async()=>{const ins=box.querySelectorAll("input");try{await signInWithEmailAndPassword(auth,ins[0].value.trim(),ins[1].value)}catch(e){toast(e.message)}};$ ("#forgot")?.addEventListener("click",async e=>{e.preventDefault();const email=box.querySelector("input").value.trim();if(!email)return toast("Enter your email first");try{await sendPasswordResetEmail(auth,email);toast("Reset email sent")}catch(e){toast(e.message)}});$("#register").onclick=e=>{e.preventDefault();showAuth("register")};$("#join").onclick=e=>{e.preventDefault();showAuth("join")}}else if(mode==="join"){$("#backLogin").onclick=()=>showAuth("login");$("#redeem").onclick=async()=>{const code=box.querySelector("input").value.trim().toUpperCase();if(!code)return toast("Enter the invite code");try{const qs=await getDocs(query(C("schoolInvitations"),where("code","==",code),limit(1)));if(qs.empty)return toast("Invite code not found");const inv=qs.docs[0],x=inv.data();if(x.used)return toast("Invite code has already been used");await setDoc(D("schoolUsers",x.schoolId+"_"+st.u.uid),{uid:st.u.uid,schoolId:x.schoolId,role:x.role,status:"active",email:st.u.email,inviteId:inv.id,createdAt:serverTimestamp()});await updateDoc(inv.ref,{used:true,consumedBy:st.u.uid,consumedAt:serverTimestamp()});toast("You joined the school as "+labels[x.role]);await context(st.u);};catch(e){toast(e.message)}}}else{$("#backLogin").onclick=()=>showAuth("login");$("#registerGo").onclick=async()=>{const v=[...box.querySelectorAll("input")].map(x=>x.value.trim());if(!v[0]||!v[1]||v[2].length<6||!v[3])return toast("Owner name, email, password and school name are required");try{const c=await createUserWithEmailAndPassword(auth,v[1],v[2]);await updateProfile(c.user,{displayName:v[0]});let sc=code();while((await getDoc(D("publicSchoolCodes",sc))).exists())sc=code();const s=await addDoc(C("schools"),{name:v[3],email:v[4],phone:v[5],address:v[6],schoolType:v[7],motto:v[8],website:v[9],schoolCode:sc,subscriptionStatus:"pending",subscriptionPrice:10000,createdBy:c.user.uid,createdAt:serverTimestamp()});await setDoc(D("publicSchoolCodes",sc),{schoolId:s.id,schoolCode:sc,schoolName:v[3],createdAt:serverTimestamp()});await setDoc(D("schoolUsers",s.id+"_"+c.user.uid),{uid:c.user.uid,schoolId:s.id,role:"owner",isOwner:true,status:"active",email:v[1],createdAt:serverTimestamp()});await audit("school.registered",{schoolId:s.id});toast("Registration submitted. School code: "+sc)}catch(e){toast(e.message)}}}}
function login(){return`<div class="auth"><div class="card"><div class="hero"><div class="brand">Report X</div><p>Smarter School Results. Better Academic Records.</p></div><div id="authBox">${loginBox()}</div></div></div>`}
function dashboard(){const r=role();let items=itemsFor(r);return shell("Dashboard",`<div class="grid g4" id="stats"></div><div class="card"><h3>Workflow</h3><p>Registrar creates students → Principal/VP approves class assignment → teacher enters and submits results → Principal/VP approves and locks → immutable report snapshot → printer/parent access.</p></div>`,items)}
function itemsFor(r){const common=[ ["home","⌂","Home"] ];if(r==="superAdmin")return common.concat([["schools","🏫","Schools"],["payments","₦","Payments"],["platform","⚙","Platform"],["audit","▣","Audit"]]);if(r==="supportAdmin")return common.concat([["schools","🏫","Schools"],["tickets","?","Support"]]);if(r==="owner")return common.concat([["staff","👥","Staff"],["students","🎓","Students"],["classes","▤","Classes"],["branding","🎨","Branding"],["subscription","₦","Subscription"]]);if(r==="principal"||r==="vicePrincipal")return common.concat([["students","🎓","Students"],["classes","▤","Classes"],["academics","📚","Academics"],["teacherAssignments","👨‍🏫","Teacher Assignments"],["staff","👥","Staff"],["review","✓","Results"],["reports","▤","Reports"],["branding","🎨","Branding"]]);if(r==="registrar")return common.concat([["students","🎓","Students"],["classes","▤","Classes"],["assignments","↔","Assignments"],["parents","👪","Parents"]]);if(r==="teacher")return common.concat([["teacher","✎","Grade Entry"],["attendance","◷","Attendance"],["comments","💬","Comments"]]);if(r==="printer")return common.concat([["reports","▤","Reports"],["printlog","▤","Print Log"]]);if(r==="parent")return common.concat([["parent","👪","My Children"]]);return common}
async function home(){const r=role();let items=itemsFor(r), stats=[];if(st.sid){const qs=async n=>{try{return(await getDocs(query(C(n),where("schoolId","==",st.sid),limit(100)))).size}catch(e){return 0}};if(r!=="superAdmin"&&r!=="supportAdmin")stats=await Promise.all([["Students","students"],["Classes","classes"],["Results","results"],["Reports","reportSnapshots"]].map(async x=>[x[0],await qs(x[1])]));else{stats=[["Schools",(await getDocs(query(C("schools"),limit(100)))).size],["Pending Payments",(await getDocs(query(C("schoolPaymentProofs"),where("status","==","pending"),limit(100)))).size]]}}else if(r==="superAdmin"){stats=[["Schools",(await getDocs(query(C("schools"),limit(100)))).size],["Pending Payments",(await getDocs(query(C("schoolPaymentProofs"),where("status","==","pending"),limit(100)))).size]]}else stats=[];return shell("Dashboard",`<div class="grid g4">${stats.map(x=>`<div class="card stat"><div class="n">${x[1]}</div><div class="l">${esc(x[0])}</div></div>`).join("")}<div class="card"><h3>${esc(st.school?.name||"Report X")}</h3><p>${esc(st.school?.motto||"Secure academic records and professional reports.")}</p>${st.school?`<p>Subscription: ${badge(st.school.subscriptionStatus)} ${st.school.subscriptionExpiresAt?`expires ${date(st.school.subscriptionExpiresAt)}`:""}</p>`:""}</div></div>`,items)}
async function schools(){if(!["superAdmin","supportAdmin"].includes(role()))return home();const s=(await getDocs(query(C("schools"),limit(100)))).docs.map(d=>({id:d.id,...d.data()}));return shell("Schools",`<div class="card table"><table><thead><tr><th>School</th><th>Code</th><th>Status</th><th>Created</th><th>Actions</th></tr></thead><tbody>${s.map(x=>`<tr><td>${esc(x.name)}<br><small>${esc(x.email||"")}</small></td><td>${esc(x.schoolCode||"—")}</td><td>${badge(x.subscriptionStatus)}</td><td>${date(x.createdAt)}</td><td><button class="btn sm" data-school="${x.id}">Open</button></td></tr>`).join("")}</tbody></table></div>`).then(v=>{setTimeout(()=>document.querySelectorAll("[data-school]").forEach(b=>b.onclick=()=>schoolDetail(b.dataset.school)),0);return v})}
async function schoolDetail(id){const s=(await getDoc(D("schools",id))).data();const us=(await getDocs(query(C("schoolUsers"),where("schoolId","==",id)))).docs.map(d=>({id:d.id,...d.data()}));const body=`<div class="card"><div class="between"><div><h3>${esc(s.name)}</h3><p>${esc(s.address||"")} · ${esc(s.phone||"")}</p><p>Code: <b>${esc(s.schoolCode||"—")}</b> · ${badge(s.subscriptionStatus)}</p></div>${role()==="superAdmin"?`<div class="row"><button class="btn ok" id="accept">Approve</button><button class="btn danger" id="suspend">Suspend</button></div>`:""}</div></div><div class="card table"><h3>Staff</h3><table><thead><tr><th>Email</th><th>Role</th><th>Status</th></tr></thead><tbody>${us.map(u=>`<tr><td>${esc(u.email||u.uid)}</td><td>${esc(labels[u.role]||u.role)}</td><td>${badge(u.status)}</td></tr>`).join("")}</tbody></table></div><button class="btn secondary" id="back">Back</button>`;const v=shell("School Detail",body,itemsFor(role()));setTimeout(()=>{$("#back")?.addEventListener("click",()=>nav("schools"));$("#accept")?.addEventListener("click",async()=>{await updateDoc(D("schools",id),{subscriptionStatus:"active",approvedAt:serverTimestamp(),approvedBy:st.u.uid,subscriptionExpiresAt:new Date(Date.now()+365*86400000)});toast("School approved for 12 months");nav("schools")});$("#suspend")?.addEventListener("click",async()=>{await updateDoc(D("schools",id),{subscriptionStatus:"suspended"});toast("School suspended");nav("schools")})},0);return v}
async function students(){if(!can("students"))return home();const arr=(await getDocs(query(C("students"),where("schoolId","==",st.sid),limit(200)))).docs.map(d=>({id:d.id,...d.data()}));let body=`<div class="between"><p>Registrar creates students. Principal/VP controls approval of class assignments.</p><button class="btn" id="add">+ Add student</button></div><div class="card table"><table><thead><tr><th>Student</th><th>Admission</th><th>Class</th><th>Parent</th><th>Status</th><th></th></tr></thead><tbody>${arr.map(s=>`<tr><td>${esc((s.firstName||"")+" "+(s.lastName||""))}</td><td>${esc(s.admissionNumber)}</td><td>${esc(s.className||"Unassigned")}</td><td>${esc(s.parentEmail||"—")}</td><td>${badge(s.status||"active")}</td><td><button class="btn secondary sm" data-edit="${s.id}">Edit</button></td></tr>`).join("")}</tbody></table></div>`;const v=shell("Students",body,itemsFor(role()));setTimeout(()=>{$("#add")?.addEventListener("click",()=>studentModal());document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>studentModal(b.dataset.edit))},0);return v}
async function studentModal(id){let s={};if(id){const q=await getDoc(D("students",id));s=q.data()||{}}const classes=(await getDocs(query(C("classes"),where("schoolId","==",st.sid),limit(100)))).docs.map(d=>({id:d.id,...d.data()}));const b=`<div class="grid g2">${field("First name","text",s.firstName||"")} ${field("Last name","text",s.lastName||"")} ${field("Admission number","text",s.admissionNumber||"")} ${field("Gender","text",s.gender||"")} ${field("Date of birth","date",s.dob||"")} ${field("Parent name","text",s.parentName||"")} ${field("Parent email","email",s.parentEmail||"")} ${field("Parent phone","tel",s.parentPhone||"")} ${sel("Class",[["","Unassigned"],...classes.map(c=>[c.id,c.name+(c.arm?" - "+c.arm:"")])],s.classId||"")}</div>`;const m=modal(id?"Edit Student":"Add Student",b,id?"Save changes":"Create student");m.querySelector("#ms").onclick=async()=>{const ins=[...m.querySelectorAll("input")],v={firstName:ins[0].value.trim(),lastName:ins[1].value.trim(),admissionNumber:ins[2].value.trim(),gender:ins[3].value,dob:ins[4].value,parentName:ins[5].value,parentEmail:ins[6].value,parentPhone:ins[7].value,classId:m.querySelector("select")?.value||null,schoolId:st.sid,status:"active"};if(!v.firstName||!v.lastName||!v.admissionNumber)return toast("Name and admission number are required");try{if(id)await updateDoc(D("students",id),{...v,updatedAt:serverTimestamp()});else{const ref=await addDoc(C("students"),{...v,createdAt:serverTimestamp(),createdBy:st.u.uid});await setDoc(D("studentAdmissions",ref.id),{schoolId:st.sid,studentId:ref.id,admissionNumber:v.admissionNumber,status:"admitted",createdAt:serverTimestamp()});if(v.parentEmail)await addDoc(C("parentInvitations"),{schoolId:st.sid,studentId:ref.id,invitedEmail:v.parentEmail,status:"pending",createdAt:serverTimestamp()})}await audit(id?"student.updated":"student.created",{targetType:"student",targetId:id||"new"});closeModal();nav("students")}catch(e){toast(e.message)}}}
async function classes(){if(!can("classes"))return home();const arr=(await getDocs(query(C("classes"),where("schoolId","==",st.sid),limit(100)))).docs.map(d=>({id:d.id,...d.data()}));const body=`<div class="between"><p>Classes and arms used for assignments and reports.</p><button class="btn" id="add">+ Add class</button></div><div class="card table"><table><thead><tr><th>Name</th><th>Arm</th><th>Session</th><th>Students</th><th></th></tr></thead><tbody>${arr.map(c=>`<tr><td>${esc(c.name)}</td><td>${esc(c.arm||"—")}</td><td>${esc(c.sessionName||"—")}</td><td>${c.studentCount||0}</td><td><button class="btn secondary sm" data-del="${c.id}">Delete</button></td></tr>`).join("")}</tbody></table></div>`;const v=shell("Classes",body,itemsFor(role()));setTimeout(()=>{$("#add")?.addEventListener("click",()=>classModal());document.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{if(confirm("Delete class?")){await deleteDoc(D("classes",b.dataset.del));nav("classes")}})},0);return v}

async function assignments(){const classes=(await getDocs(query(C("classes"),where("schoolId","==",st.sid),limit(100)))).docs.map(d=>({id:d.id,...d.data()}));const students=(await getDocs(query(C("students"),where("schoolId","==",st.sid),limit(200)))).docs.map(d=>({id:d.id,...d.data()}));const as=(await getDocs(query(C("studentClassAssignments"),where("schoolId","==",st.sid),limit(200)))).docs.map(d=>({id:d.id,...d.data()}));const body=`<div class="between"><p>Registrar proposes class placement. Principal/VP approves it before teachers can use the roster.</p><button class="btn" id="add">+ Assign student</button></div><div class="card table"><table><thead><tr><th>Student</th><th>Class</th><th>Status</th><th>Action</th></tr></thead><tbody>${as.map(a=>{const s=students.find(x=>x.id===a.studentId),c=classes.find(x=>x.id===a.classId);return`<tr><td>${esc(s?.firstName+" "+s?.lastName)}</td><td>${esc(c?.name||a.className||"—")}</td><td>${badge(a.approved?"approved":"pending")}</td><td>${isAcad()&&!a.approved?`<button class="btn ok sm" data-ap="${a.id}">Approve</button>`:""}</td></tr>`}).join("")}</tbody></table></div>`;const v=shell("Class Assignments",body,itemsFor(role()));setTimeout(()=>{$("#add")?.addEventListener("click",()=>assignmentModal(students,classes));document.querySelectorAll("[data-ap]").forEach(b=>b.onclick=async()=>{await updateDoc(D("studentClassAssignments",b.dataset.ap),{approved:true,approvedBy:st.u.uid,approvedAt:serverTimestamp()});toast("Assignment approved");nav("assignments")})},0);return v}

async function staff(){if(!can("staff"))return home();const us=(await getDocs(query(C("schoolUsers"),where("schoolId","==",st.sid),limit(100)))).docs.map(d=>({id:d.id,...d.data()}));const body=`<div class="between"><p>Passwords are never stored in Firestore. Staff must use Firebase Authentication.</p><button class="btn" id="add">+ Add staff profile</button></div><div class="card table"><table><thead><tr><th>Email</th><th>Role</th><th>Status</th><th></th></tr></thead><tbody>${us.map(u=>`<tr><td>${esc(u.email||u.uid)}</td><td>${esc(labels[u.role]||u.role)}</td><td>${badge(u.status)}</td><td>${u.uid!==st.u.uid?`<button class="btn danger sm" data-s="${u.id}">Deactivate</button>`:""}</td></tr>`).join("")}</tbody></table></div>`;const v=shell("Staff",body,itemsFor(role()));setTimeout(()=>{$("#add")?.addEventListener("click",()=>staffModal());document.querySelectorAll("[data-s]").forEach(b=>b.onclick=async()=>{await updateDoc(D("schoolUsers",b.dataset.s),{status:"disabled"});nav("staff")})},0);return v}

async function teacherAssignments(){if(!isAcad())return home();const teachers=(await getDocs(query(C("schoolUsers"),where("schoolId","==",st.sid),where("role","==","teacher"),limit(100)))).docs.map(d=>d.data());const classes=(await getDocs(query(C("classes"),where("schoolId","==",st.sid),limit(100)))).docs.map(d=>({id:d.id,...d.data()}));const subjects=(await getDocs(query(C("subjects"),where("schoolId","==",st.sid),limit(100)))).docs.map(d=>({id:d.id,...d.data()}));const as=(await getDocs(query(C("teacherAssignments"),where("schoolId","==",st.sid),limit(200)))).docs.map(d=>({id:d.id,...d.data()}));const body=`<div class="between"><p>Assign teachers to specific class/subject combinations. This controls grade-entry access.</p><button class="btn" id="add">+ Assign teacher</button></div><div class="card table"><table><thead><tr><th>Teacher</th><th>Class</th><th>Subject</th><th>Status</th><th></th></tr></thead><tbody>${as.map(a=>`<tr><td>${esc(a.teacherEmail||a.teacherUid)}</td><td>${esc(a.className||a.classId)}</td><td>${esc(a.subjectName||a.subjectId)}</td><td>${badge(a.status||"approved")}</td><td><button class="btn danger sm" data-ta="${a.id}">Remove</button></td></tr>`).join("")}</tbody></table></div>`;const v=shell("Teacher Assignments",body,itemsFor(role()));setTimeout(()=>{$("#add")?.addEventListener("click",()=>teacherAssignmentModal(teachers,classes,subjects));document.querySelectorAll("[data-ta]").forEach(b=>b.onclick=async()=>{if(confirm("Remove assignment?")){await deleteDoc(D("teacherAssignments",b.dataset.ta));nav("teacherAssignments")}})},0);return v}
async function teacherAssignmentModal(ts,cs,ss){const b=sel("Teacher",ts.map(t=>[t.uid,t.email||t.uid]))+sel("Class",cs.map(c=>[c.id,c.name+(c.arm?" - "+c.arm:"")]))+sel("Subject",ss.map(x=>[x.id,x.name||x.code||x.id]));const m=modal("Assign Teacher",b);m.querySelector("#ms").onclick=async()=>{const q=m.querySelectorAll("select"),t=ts.find(x=>x.uid===q[0].value),c=cs.find(x=>x.id===q[1].value),s=ss.find(x=>x.id===q[2].value);if(!t||!c||!s)return toast("Select all fields");const id=st.sid+"_"+t.uid+"_"+c.id+"_"+s.id;await setDoc(D("teacherAssignments",id),{schoolId:st.sid,teacherUid:t.uid,teacherEmail:t.email,classId:c.id,className:c.name,subjectId:s.id,subjectName:s.name,status:"approved",createdAt:serverTimestamp(),createdBy:st.u.uid});await setDoc(D("teacherSubjectAssignments",st.sid+"_"+t.uid+"_"+s.id),{schoolId:st.sid,teacherUid:t.uid,subjectId:s.id,createdAt:serverTimestamp()});await audit("teacher.assignment_created",{targetId:id});closeModal();nav("teacherAssignments")}}
async function academics(){if(!isAcad())return home();const collections=["academicSessions","terms","subjects","gradingScales","assessmentComponents"];const counts=await Promise.all(collections.map(async n=>(await getDocs(query(C(n),where("schoolId","==",st.sid),limit(100)))).size));const body=`<div class="grid g2">${collections.map((n,i)=>`<div class="card"><h3>${esc(n)}</h3><div style="font-size:28px;font-weight:900">${counts[i]}</div><p class="muted">Manage ${esc(n.replace(/([A-Z])/g," $1").toLowerCase())} records.</p><button class="btn secondary sm" data-ac="${n}">Manage</button></div>`).join("")}</div>`;const v=shell("Academic Configuration",body,itemsFor(role()));setTimeout(()=>document.querySelectorAll("[data-ac]").forEach(b=>b.onclick=()=>genericAcademicModal(b.dataset.ac)),0);return v}
async function genericAcademicModal(kind){const names={academicSessions:["Session name","startDate","endDate"],terms:["Term name","startDate","endDate"],subjects:["Subject name","code"],gradingScales:["Scale name","rules"],assessmentComponents:["Component name","maxScore"]};const n=names[kind]||["Name","Description"];const b=n.map(x=>field(x,x.toLowerCase().includes("date")?"date":x.toLowerCase().includes("score")?"number":"text")).join("");const m=modal("Add "+kind,b);m.querySelector("#ms").onclick=async()=>{const i=m.querySelectorAll("input"),o={schoolId:st.sid,name:i[0].value.trim(),createdAt:serverTimestamp(),createdBy:st.u.uid};if(i[1])o[n[1]]=i[1].value;if(i[2])o[n[2]]=i[2].value;await addDoc(C(kind),o);closeModal();nav("academics")}}
async function teacher(){if(role()!=="teacher")return home();const as=(await getDocs(query(C("teacherAssignments"),where("schoolId","==",st.sid),where("teacherUid","==",st.u.uid),limit(100)))).docs.map(d=>({id:d.id,...d.data()}));const body=`<div class="card"><p>Only approved student class assignments should appear in your rosters. Enter CA and examination scores, save drafts or submit.</p>${as.length?as.map(a=>`<button class="btn secondary sm" data-ga="${a.id}">${esc(a.className||a.classId)} — ${esc(a.subjectName||a.subjectId)}</button>`).join(" "):"<div class="empty">No teacher assignments yet.</div>"}</div><div id="gradeArea"></div>`;const v=shell("Grade Entry",body,itemsFor(role()));setTimeout(()=>document.querySelectorAll("[data-ga]").forEach(b=>b.onclick=()=>gradeRoster(as.find(a=>a.id===b.dataset.ga))),0);return v}
async function gradeRoster(a){const ass=(await getDocs(query(C("studentClassAssignments"),where("schoolId","==",st.sid),where("classId","==",a.classId),where("approved","==",true),limit(200)))).docs.map(d=>({id:d.id,...d.data()}));const area=$("#gradeArea");if(!ass.length){area.innerHTML='<div class="card empty">No approved students.</div>';return}let rows=[];for(const x of ass){const s=await getDoc(D("students",x.studentId));if(s.exists())rows.push({id:x.studentId,name:s.data().firstName+" "+s.data().lastName})}area.innerHTML=`<div class="card table"><table><thead><tr><th>Student</th><th>CA / 30</th><th>Exam / 70</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.name)}</td><td><input id="ca_${x.id}" type="number" min="0" max="30" style="width:90px"></td><td><input id="ex_${x.id}" type="number" min="0" max="70" style="width:90px"></td></tr>`).join("")}</tbody></table><div class="row" style="margin-top:12px"><button class="btn secondary" id="draft">Save draft</button><button class="btn" id="submit">Submit for approval</button></div></div>`;async function save(status){const batch=writeBatch(db);for(const x of rows){const ref=D("results",st.sid+"_"+x.id+"_"+a.classId+"_"+a.subjectId);const ca=Math.max(0,Math.min(30,Number($("#ca_"+x.id).value||0))),ex=Math.max(0,Math.min(70,Number($("#ex_"+x.id).value||0)));batch.set(ref,{schoolId:st.sid,studentId:x.id,classId:a.classId,subjectId:a.subjectId,teacherUid:st.u.uid,ca,exam:ex,total:ca+ex,status,updatedAt:serverTimestamp(),createdAt:serverTimestamp()},{merge:true})}await batch.commit();await audit("results."+status,{targetId:a.classId});toast(status==="submitted"?"Submitted for approval":"Draft saved")}$("#draft").onclick=()=>save("draft");$("#submit").onclick=()=>save("submitted")}
async function review(){if(!isAcad())return home();const rs=(await getDocs(query(C("results"),where("schoolId","==",st.sid),where("status","==","submitted"),limit(300)))).docs.map(d=>({id:d.id,...d.data()}));const body=`<div class="card table"><table><thead><tr><th>Student</th><th>Subject</th><th>Score</th><th>Teacher</th><th>Action</th></tr></thead><tbody>${rs.map(r=>`<tr><td>${esc(r.studentId)}</td><td>${esc(r.subjectId)}</td><td>${r.total}</td><td>${esc(r.teacherUid)}</td><td><button class="btn ok sm" data-ok="${r.id}">Approve</button><button class="btn danger sm" data-no="${r.id}">Reject</button></td></tr>`).join("")}</tbody></table></div>`;const v=shell("Result Review",body,itemsFor(role()));setTimeout(()=>{document.querySelectorAll("[data-ok]").forEach(b=>b.onclick=()=>decideResult(b.dataset.ok,"approved"));document.querySelectorAll("[data-no]").forEach(b=>b.onclick=()=>decideResult(b.dataset.no,"rejected"))},0);return v}
async function decideResult(id,status){await updateDoc(D("results",id),{status,reviewedBy:st.u.uid,reviewedAt:serverTimestamp()});await addDoc(C("resultApprovalLogs"),{schoolId:st.sid,resultId:id,decision:status,actorUid:st.u.uid,createdAt:serverTimestamp()});toast("Result "+status);nav("review")}
async function reports(){const r=role();const q=await getDocs(query(C("reportSnapshots"),where("schoolId","==",st.sid),limit(100)));const arr=q.docs.map(d=>({id:d.id,...d.data()}));const body=`<div class="notice">Finalized reports are immutable snapshots. Printing never changes scores, signatures, stamps, branding or report content.</div><div class="card table"><table><thead><tr><th>Student</th><th>Session</th><th>Term</th><th>Status</th><th>Actions</th></tr></thead><tbody>${arr.map(x=>`<tr><td>${esc(x.studentName||x.studentId)}</td><td>${esc(x.sessionName||"—")}</td><td>${esc(x.termName||"—")}</td><td>${badge("locked")}</td><td><button class="btn secondary sm" data-view="${x.id}">View</button>${["printer","principal","vicePrincipal","owner"].includes(r)?` <button class="btn sm" data-print="${x.id}">Print</button>`:""}</td></tr>`).join("")}</tbody></table></div>${isAcad()?`<button class="btn" id="generate">Generate finalized report</button>`:""}`;const v=shell("Reports",body,itemsFor(role()));setTimeout(()=>{document.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>viewReport(b.dataset.view));document.querySelectorAll("[data-print]").forEach(b=>b.onclick=()=>printReport(b.dataset.print));$("#generate")?.addEventListener("click",()=>generateReport())},0);return v}
async function generateReport(){if(!isAcad())return home();const students=(await getDocs(query(C("students"),where("schoolId","==",st.sid),limit(300)))).docs.map(d=>({id:d.id,...d.data()}));let made=0;for(const s of students){if(!s.classId)continue;const rs=(await getDocs(query(C("results"),where("schoolId","==",st.sid),where("studentId","==",s.id),where("status","==","approved"),limit(100)))).docs.map(d=>({id:d.id,...d.data()}));if(!rs.length)continue;const total=rs.reduce((a,x)=>a+Number(x.total||0),0);const ref=await addDoc(C("reportSnapshots"),{schoolId:st.sid,studentId:s.id,studentName:s.firstName+" "+s.lastName,admissionNumber:s.admissionNumber,className:s.className||"",subjects:rs.map(x=>({subjectId:x.subjectId,ca:x.ca,exam:x.exam,total:x.total,grade:gradeFor(x.total)})),overallTotal:total,status:"locked",createdBy:st.u.uid,createdAt:serverTimestamp(),contentHash:rid()});for(const r of rs)await updateDoc(D("results",r.id),{status:"locked",lockedBy:st.u.uid,lockedAt:serverTimestamp()});const token=rid();await setDoc(D("reportVerification",token),{schoolId:st.sid,reportSnapshotId:ref.id,valid:true,studentName:s.firstName+" "+s.lastName,schoolName:st.school.name,reportId:token,createdAt:serverTimestamp()});made++}await audit("reports.bulk_finalized",{targetId:String(made)});toast(made+" report(s) finalized");nav("reports")}
function gradeFor(score){const n=Number(score||0);if(n>=75)return"A";if(n>=65)return"B";if(n>=55)return"C";if(n>=45)return"D";if(n>=40)return"E";return"F"}
async function viewReport(id){const x=(await getDoc(D("reportSnapshots",id))).data();if(!x)return;const br=st.school?.branding||{};const html=`<div class="report"><div class="report-head" style="--rc:${esc(br.color||"#4338ca")}">${br.logo?`<img src="${br.logo}">`:""}<div><h2>${esc(st.school.name)}</h2><p>${esc(st.school.motto||"")}</p><small>${esc(st.school.address||"")}</small></div></div><h3>Student Report Card</h3><p><b>${esc(x.studentName)}</b> · Admission: ${esc(x.admissionNumber||"—")} · Class: ${esc(x.className||"—")}</p><table><thead><tr><th>Subject</th><th>CA</th><th>Exam</th><th>Total</th><th>Grade</th></tr></thead><tbody>${(x.subjects||[]).map(s=>`<tr><td>${esc(s.subjectId)}</td><td>${s.ca}</td><td>${s.exam}</td><td>${s.total}</td><td>${esc(s.grade||gradeFor(s.total))}</td></tr>`).join("")}</tbody></table><p><b>Overall Total:</b> ${x.overallTotal}</p><div class="sigs"><div class="sig">${br.signature?`<img src="${br.signature}">`:""}<div class="sigline">Principal / Official Signature</div></div><div class="sig">${br.stamp?`<img src="${br.stamp}">`:""}<div class="sigline">Official Stamp</div></div></div></div>`;const m=modal("Finalized Report",html,"Print / Save PDF");m.querySelector("#ms").onclick=()=>{m.remove();$("#printHost").innerHTML=html;window.print();setTimeout(()=>{$("#printHost").innerHTML=""},1000);logPrint(id)} }
async function printReport(id){await viewReport(id)}async function logPrint(id){try{await addDoc(C("printingLogs"),{schoolId:st.sid,reportSnapshotId:id,printerUid:st.u.uid,action:"print",createdAt:serverTimestamp()});await audit("report.printed",{targetId:id})}catch(e){}}
async function branding(){if(!can("brand"))return home();const b=st.school?.branding||{};const body=`<div class="card"><p>Images are compressed in the browser and stored as data URLs. Keep files small.</p><div class="grid g2">${field("Motto","text",st.school.motto||"")}${field("Report color","color",b.color||"#4338ca")}</div><div class="grid g3">${field("Logo","file","","accept=image/* id=logo")}${field("Official signature","file","","accept=image/* id=sig")}${field("Official stamp","file","","accept=image/* id=stamp")}</div><button class="btn" id="saveBrand">Save branding</button></div>`;const v=shell("School Branding",body,itemsFor(role()));setTimeout(()=>$("#saveBrand").onclick=async()=>{const out={...b,color:v.querySelector('input[type=color]').value};for(const [id,key] of [["logo","logo"],["sig","signature"],["stamp","stamp"]]){const f=v.querySelector("#"+id)?.files?.[0];if(f)out[key]=await compress(f)}await updateDoc(D("schools",st.sid),{motto:v.querySelector('input[type=text]').value,branding:out});st.school.motto=v.querySelector('input[type=text]').value;st.school.branding=out;toast("Branding saved")},0);return v}
function compress(file){return new Promise((res,rej)=>{if(file.size>5e6)return rej(new Error("Image must be under 5MB"));const r=new FileReader(),i=new Image();r.onload=()=>{i.onload=()=>{const c=document.createElement("canvas"),scale=Math.min(1,400/Math.max(i.width,i.height));c.width=i.width*scale;c.height=i.height*scale;c.getContext("2d").drawImage(i,0,0,c.width,c.height);const u=c.toDataURL("image/jpeg",.72);if(u.length>350000)return rej(new Error("Compressed image is still too large"));res(u)};i.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}
async function subscription(){const p=(await getDocs(query(C("schoolPaymentProofs"),where("schoolId","==",st.sid),limit(20)))).docs.map(d=>({id:d.id,...d.data()}));const body=`<div class="card"><h3>Annual subscription</h3><p>Current price: <b>₦${Number(st.school.subscriptionPrice||10000).toLocaleString()}</b></p><p>Status: ${badge(st.school.subscriptionStatus)} ${st.school.subscriptionExpiresAt?"· expires "+date(st.school.subscriptionExpiresAt):""}</p><button class="btn" id="pay">Submit payment proof</button></div><div class="card table"><table><thead><tr><th>Reference</th><th>Amount</th><th>Status</th><th>Date</th></tr></thead><tbody>${p.map(x=>`<tr><td>${esc(x.reference||"—")}</td><td>₦${Number(x.amount||0).toLocaleString()}</td><td>${badge(x.status)}</td><td>${date(x.createdAt)}</td></tr>`).join("")}</tbody></table></div>`;const v=shell("Subscription",body,itemsFor(role()));setTimeout(()=>$("#pay").onclick=()=>paymentModal(),0);return v}
async function paymentModal(){const b=`${field("Amount","number",st.school.subscriptionPrice||10000)}${field("Payment reference")} ${field("Payment method","text","Bank transfer")} ${field("Proof URL","url")}`;const m=modal("Submit payment proof",b);m.querySelector("#ms").onclick=async()=>{const i=m.querySelectorAll("input");await addDoc(C("schoolPaymentProofs"),{schoolId:st.sid,amount:Number(i[0].value),reference:i[1].value,method:i[2].value,proofUrl:i[3].value,status:"pending",submittedBy:st.u.uid,createdAt:serverTimestamp()});toast("Payment submitted");closeModal();nav("subscription")}}
async function payments(){if(role()!=="superAdmin")return home();const p=(await getDocs(query(C("schoolPaymentProofs"),where("status","==","pending"),limit(100)))).docs.map(d=>({id:d.id,...d.data()}));const body=`<div class="card table"><table><thead><tr><th>School</th><th>Amount</th><th>Reference</th><th>Action</th></tr></thead><tbody>${p.map(x=>`<tr><td>${esc(x.schoolId)}</td><td>₦${Number(x.amount||0).toLocaleString()}</td><td>${esc(x.reference||"—")}</td><td><button class="btn ok sm" data-pa="${x.id}">Approve</button><button class="btn danger sm" data-pr="${x.id}">Reject</button></td></tr>`).join("")}</tbody></table></div>`;const v=shell("Payment Verification",body,itemsFor(role()));setTimeout(()=>{document.querySelectorAll("[data-pa]").forEach(b=>b.onclick=()=>approvePayment(b.dataset.pa,true));document.querySelectorAll("[data-pr]").forEach(b=>b.onclick=()=>approvePayment(b.dataset.pr,false))},0);return v}
async function approvePayment(id,ok){const p=await getDoc(D("schoolPaymentProofs",id));if(!p.exists())return;const x=p.data();await updateDoc(D("schoolPaymentProofs",id),{status:ok?"approved":"rejected",reviewedBy:st.u.uid,reviewedAt:serverTimestamp()});if(ok){await updateDoc(D("schools",x.schoolId),{subscriptionStatus:"active",subscriptionExpiresAt:new Date(Date.now()+365*86400000),subscriptionPrice:x.amount,subscriptionApprovedBy:st.u.uid,subscriptionApprovedAt:serverTimestamp()});await setDoc(D("subscriptions",x.schoolId),{schoolId:x.schoolId,status:"active",price:x.amount,startsAt:serverTimestamp(),expiresAt:new Date(Date.now()+365*86400000),approvedBy:st.u.uid})}toast(ok?"Payment approved and subscription activated":"Payment rejected");nav("payments")}
async function parent(){if(role()!=="parent")return home();const links=(await getDocs(query(C("parentLinks"),where("parentUid","==",st.u.uid),limit(50)))).docs.map(d=>d.data());const body=`<div class="grid g2">${links.map(x=>`<div class="card"><h3>${esc(x.studentName||x.studentId)}</h3><p>Student ID: ${esc(x.studentId)}</p><button class="btn secondary sm" data-child="${x.studentId}">View finalized reports</button></div>`).join("")||'<div class="empty">No children linked yet. Ask the school registrar to link your account.</div>'}</div>`;const v=shell("My Children",body,itemsFor(role()));setTimeout(()=>document.querySelectorAll("[data-child]").forEach(b=>b.onclick=()=>parentReports(b.dataset.child)),0);return v}
async function parentReports(sid){const rs=(await getDocs(query(C("reportSnapshots"),where("schoolId","==",st.sid),where("studentId","==",sid),limit(50)))).docs.map(d=>({id:d.id,...d.data()}));const body=`<div class="card table"><table><thead><tr><th>Report</th><th>Total</th><th></th></tr></thead><tbody>${rs.map(x=>`<tr><td>${date(x.createdAt)}</td><td>${x.overallTotal}</td><td><button class="btn sm" data-v="${x.id}">View</button></td></tr>`).join("")}</tbody></table></div>`;const v=shell("Child Reports",body,itemsFor(role()));setTimeout(()=>document.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>viewReport(b.dataset.v)),0);return v}
async function auditView(){const q=await getDocs(query(C("auditLogs"),where("schoolId","==",st.sid),orderBy("createdAt","desc"),limit(100)));return shell("Audit Log",`<div class="card table"><table><thead><tr><th>Action</th><th>Actor</th><th>Date</th></tr></thead><tbody>${q.docs.map(d=>{const x=d.data();return`<tr><td>${esc(x.action)}</td><td>${esc(x.actorUid)}</td><td>${date(x.createdAt)}</td></tr>`}).join("")}</tbody></table></div>`,itemsFor(role()))}
async function platform(){if(role()!=="superAdmin")return home();const s=await getDoc(D("platformSettings","main"));const x=s.exists()?s.data():{price:10000};const body=`<div class="card">${field("Annual subscription price","number",x.price||10000)}<button class="btn" id="saveP">Save</button></div>`;const v=shell("Platform Settings",body,itemsFor(role()));setTimeout(()=>$("#saveP").onclick=async()=>{await setDoc(D("platformSettings","main"),{price:Number(v.querySelector("input").value),updatedAt:serverTimestamp()},{merge:true});toast("Platform settings saved")},0);return v}
async function printlog(){const q=await getDocs(query(C("printingLogs"),where("schoolId","==",st.sid),orderBy("createdAt","desc"),limit(100)));return shell("Print Log",`<div class="card table"><table><thead><tr><th>Report</th><th>Printer</th><th>Action</th><th>Date</th></tr></thead><tbody>${q.docs.map(d=>{const x=d.data();return`<tr><td>${esc(x.reportSnapshotId)}</td><td>${esc(x.printerUid)}</td><td>${esc(x.action)}</td><td>${date(x.createdAt)}</td></tr>`}).join("")}</tbody></table></div>`,itemsFor(role()))}
async function genericPage(title,text){return shell(title,`<div class="card"><p>${esc(text)}</p></div>`,itemsFor(role()))}
async function render(){try{if(!st.u){$("#app").innerHTML=login();showAuth("login");return}let v;switch(st.route){case"home":v=await home();break;case"schools":v=await schools();break;case"payments":v=await payments();break;case"platform":v=await platform();break;case"students":v=await students();break;case"classes":v=await classes();break;case"assignments":v=await assignments();break;case"staff":v=await staff();break;case"academics":v=await academics();break;case"teacherAssignments":v=await teacherAssignments();break;case"teacher":v=await teacher();break;case"review":v=await review();break;case"reports":v=await reports();break;case"branding":v=await branding();break;case"subscription":v=await subscription();break;case"parent":v=await parent();break;case"printlog":v=await printlog();break;case"audit":v=await auditView();break;case"attendance":v=await genericPage("Attendance","Teachers record attendance for authorized students and school administrators review attendance records.");break;case"comments":v=await genericPage("Comments","Teachers and academic administrators can record report comments for authorized students.");break;case"parents":v=await genericPage("Parents","Registrar links parent accounts to students. Parent access is restricted to linked finalized reports.");break;default:v=await home()}$("#app").innerHTML=v;bind()}catch(e){console.error(e);toast(e.message);$("#app").innerHTML=`<div class="auth"><div class="card"><h3>Report X error</h3><p>${esc(e.message)}</p><button class="btn" onclick="location.reload()">Reload</button></div></div>`}}
async function context(u){st.u=u;if(!u){st.pa=null;st.ms=[];st.sid=null;st.school=null;st.mem=null;return render()}if((u.email||"").trim().toLowerCase()===A){try{await setDoc(D("platformAdmins",u.uid),{uid:u.uid,email:u.email,level:"super",status:"active",updatedAt:serverTimestamp()},{merge:true})}catch(e){console.warn(e)}}const p=await getDoc(D("platformAdmins",u.uid));st.pa=p.exists()?p.data():null;const q=await getDocs(query(C("schoolUsers"),where("uid","==",u.uid),limit(20)));st.ms=q.docs.map(d=>({id:d.id,...d.data()}));if(st.pa){st.sid=null;st.school=null;st.mem=null;st.route="home";return render()}if(!st.ms.length){st.route="home";return render()}st.mem=st.ms[0];st.sid=st.mem.schoolId;const s=await getDoc(D("schools",st.sid));st.school=s.exists()?{id:s.id,...s.data()}:null;st.route="home";await render()}
onAuthStateChanged(auth,context);window.addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(h&&st.u){st.route=h;render()}});if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
// Public verification: #verify/TOKEN
if(location.hash.startsWith("#verify/")){const token=location.hash.split("/")[1];(async()=>{try{const v=await getDoc(D("reportVerification",token));document.body.innerHTML=`<div class="auth"><div class="card hero"><div class="brand">Report X</div>${v.exists()?`<h2>✓ VALID REPORT</h2><p>${esc(v.data().schoolName)}</p><p>${esc(v.data().studentName)}</p><p class="muted">Verification ID: ${esc(token)}</p>`:`<h2>Report not found</h2>`}</div></div>`}catch(e){document.body.innerHTML=`<div class="auth"><div class="card"><h3>Verification failed</h3></div></div>`}})()}
</script></body></html>
