<html lang="en">
<head>

<style>
/* =====================================================================
   REPORT X — DESIGN SYSTEM
   ===================================================================== */
:root{
  --bg:#f6f7fb; --surface:#ffffff; --surface-2:#f1f3f9; --border:#e4e7ef;
  --text:#151826; --text-dim:#5b6072; --brand:#4338ca; --brand-2:#6d5bf5;
  --success:#16a34a; --warning:#d97706; --danger:#dc2626; --info:#0284c7;
  --radius:14px; --radius-sm:9px; --shadow:0 1px 2px rgba(20,20,40,.04),0 8px 24px -12px rgba(20,20,40,.12);
  --font: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
[data-theme="dark"]{
  --bg:#0b0d14; --surface:#141826; --surface-2:#1b2032; --border:#262c40;
  --text:#eef0f6; --text-dim:#9aa1b6; --brand:#8b7bff; --brand-2:#a394ff;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--font);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;overflow-x:hidden;transition:background .2s,color .2s}
button,input,select,textarea{font-family:inherit;color:inherit}
a{color:var(--brand)}
h1,h2,h3,h4{margin:0 0 4px}
p{margin:0 0 8px;color:var(--text-dim)}
.hidden{display:none !important}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px}

/* ---------- layout shell ---------- */
#app{min-height:100%;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--border)}
.topbar .brand{font-weight:800;font-size:18px;background:linear-gradient(135deg,var(--brand),var(--brand-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.topbar .spacer{flex:1}
.icon-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--border);background:var(--surface-2);display:flex;align-items:center;justify-content:center;cursor:pointer}
.icon-btn:hover{background:var(--border)}
.shell{flex:1;display:flex;min-height:0}
.sidebar{width:240px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);padding:14px 10px;display:flex;flex-direction:column;gap:2px}
.sidebar a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:var(--text-dim);text-decoration:none;font-size:14px;font-weight:600;cursor:pointer}
.sidebar a:hover{background:var(--surface-2)}
.sidebar a.active{background:var(--brand);color:#fff}
.main{flex:1;min-width:0;padding:20px;overflow-y:auto}
.bottomnav{display:none;position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--border);padding:6px 4px;z-index:40}
.bottomnav .row{display:flex;justify-content:space-around}
.bottomnav a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;color:var(--text-dim);text-decoration:none;padding:6px;flex:1}
.bottomnav a.active{color:var(--brand)}
@media (max-width:860px){
  .sidebar{display:none}
  .bottomnav{display:block}
  .main{padding:14px;padding-bottom:70px}
}

/* ---------- primitives ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.grid{display:grid;gap:14px}
.grid-4{grid-template-columns:repeat(4,1fr)}
.grid-3{grid-template-columns:repeat(3,1fr)}
.grid-2{grid-template-columns:repeat(2,1fr)}
@media (max-width:860px){.grid-4,.grid-3,.grid-2{grid-template-columns:1fr 1fr}}
@media (max-width:480px){.grid-4,.grid-3,.grid-2{grid-template-columns:1fr}}
.stat{display:flex;flex-direction:column;gap:6px}
.stat .num{font-size:26px;font-weight:800}
.stat .lbl{font-size:12px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.04em}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:10px;border:1px solid transparent;background:var(--brand);color:#fff;font-weight:700;font-size:14px;cursor:pointer;transition:filter .15s}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.secondary{background:var(--surface-2);color:var(--text);border-color:var(--border)}
.btn.danger{background:var(--danger)}
.btn.ghost{background:transparent;border-color:var(--border);color:var(--text)}
.btn.sm{padding:6px 10px;font-size:12px;border-radius:8px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field label{font-size:12px;font-weight:700;color:var(--text-dim)}
.field .req::after{content:" *";color:var(--danger)}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],input[type=tel],select,textarea{
  padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--surface);color:var(--text);font-size:14px;outline:none;
}
input:focus,select:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(99,91,245,.15)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--border)}
th{color:var(--text-dim);font-size:11px;text-transform:uppercase;letter-spacing:.04em}
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:700}
.badge.gray{background:var(--surface-2);color:var(--text-dim)}
.badge.green{background:rgba(22,163,74,.14);color:var(--success)}
.badge.amber{background:rgba(217,119,6,.14);color:var(--warning)}
.badge.red{background:rgba(220,38,38,.14);color:var(--danger)}
.badge.blue{background:rgba(2,132,199,.14);color:var(--info)}
.modal-bg{position:fixed;inset:0;background:rgba(10,12,20,.5);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal{background:var(--surface);border-radius:var(--radius);max-width:520px;width:100%;max-height:88vh;overflow-y:auto;padding:20px}
.toasts{position:fixed;bottom:16px;right:16px;z-index:200;display:flex;flex-direction:column;gap:8px}
@media (max-width:860px){.toasts{left:16px;right:16px;bottom:74px}}
.toast{background:var(--text);color:var(--bg);padding:12px 16px;border-radius:10px;font-size:13px;box-shadow:var(--shadow);animation:slide .2s}
@keyframes slide{from{transform:translateY(10px);opacity:0}to{transform:translateY(0);opacity:1}}
.skeleton{background:linear-gradient(90deg,var(--surface-2) 25%,var(--border) 37%,var(--surface-2) 63%);background-size:400% 100%;animation:sk 1.4s infinite;border-radius:8px}
@keyframes sk{0%{background-position:100% 0}100%{background-position:0 0}}
.empty{text-align:center;padding:40px 20px;color:var(--text-dim)}
.empty .big{font-size:36px;margin-bottom:8px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:16px;overflow-x:auto}
.tabs button{background:none;border:none;padding:10px 14px;font-weight:700;font-size:13px;color:var(--text-dim);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.active{color:var(--brand);border-color:var(--brand)}
.center-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.auth-card{width:100%;max-width:400px}
.step-dots{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.step-dots span{width:26px;height:5px;border-radius:4px;background:var(--border)}
.step-dots span.done{background:var(--brand)}
.help{font-size:12px;color:var(--text-dim)}

/* report card print styling */
.report-sheet{background:#fff;color:#111;width:210mm;min-height:297mm;margin:0 auto;padding:14mm;box-shadow:var(--shadow)}
@media print{
  body *{visibility:hidden}
  #printArea,#printArea *{visibility:visible}
  #printArea{position:absolute;left:0;top:0;width:100%}
  .report-sheet{box-shadow:none;width:100%;min-height:0;margin:0}
  @page{size:A4 portrait;margin:0}
}
.report-head{display:flex;gap:14px;align-items:center;border-bottom:3px solid var(--rc,#4338ca);padding-bottom:10px;margin-bottom:12px}
.report-head img{width:64px;height:64px;object-fit:contain;border-radius:8px}
.report-head h2{margin:0;font-size:20px}
.report-grid{width:100%;border-collapse:collapse;margin:10px 0}
.report-grid th,.report-grid td{border:1px solid #ccc;padding:5px 7px;font-size:12px}
.report-grid th{background:#f3f3f7}
.sig-row{display:flex;justify-content:space-between;margin-top:26px;gap:20px}
.sig-box{text-align:center;flex:1}
.sig-box img{height:40px;object-fit:contain}
.sig-line{border-top:1px solid #333;margin-top:30px;padding-top:4px;font-size:11px}
</style>

<body>
<div id="app">
  <div class="center-screen" id="startupScreen">
    <div class="card auth-card" style="text-align:center">
      <div class="topbar brand" style="font-size:24px;justify-content:center;border:none;padding:0">
        Report X
      </div>
      <p>Smarter School Results. Better Academic Records.</p>
      <div class="skeleton" style="height:8px;width:100%;margin:18px 0 10px"></div>
      <p class="help">Loading your school workspace…</p>
    </div>
  </div>
</div>
<div class="toasts" id="toasts"></div>

<script>
(function(){
  function showStartupError(message){
    var app = document.getElementById("app");
    if (!app) return;
    app.innerHTML =
      '<div class="center-screen">' +
        '<div class="card auth-card" style="text-align:center">' +
          '<div style="font-size:42px;margin-bottom:8px">⚠️</div>' +
          '<h3>Report X could not start</h3>' +
          '<p>' + message + '</p>' +
          '<button class="btn" style="width:100%;margin-top:8px" onclick="location.reload()">Reload</button>' +
        '</div>' +
      '</div>';
  }
  window.addEventListener("error", function(e){
    if (e && e.message) console.error("Report X startup error:", e.error || e.message);
  });
  window.addEventListener("unhandledrejection", function(e){
    console.error("Report X unhandled rejection:", e.reason);
  });
  window.__reportXStartupError = showStartupError;
})();
</script>

<script>
(function(){
  window.setTimeout(function(){
    var app = document.getElementById("app");
    if (app && app.querySelector("#startupScreen")) {
      if (window.__reportXStartupError) {
        window.__reportXStartupError("The app is taking too long to load. Check your internet connection and reload the page.");
      }
    }
  }, 15000);
})();
</script>
<script type="module">
/* =====================================================================
   1. CONFIGURATION
   ===================================================================== */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword,
  signOut, sendPasswordResetEmail, updateProfile
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore, doc, getDoc, getDocs, setDoc, addDoc, updateDoc, deleteDoc,
  collection, query, where, orderBy, limit, onSnapshot, serverTimestamp,
  runTransaction, writeBatch, Timestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyB-f85f6GRZd6XT8FhuklN6onzoDeceY",
  authDomain: "report-x-fd97e.firebaseapp.com",
  projectId: "report-x-fd97e",
  storageBucket: "report-x-fd97e.firebasestorage.app",
  messagingSenderId: "328964980773",
  appId: "1:328964980773:web:b688965d85e4b95ffb3fcc",
  measurementId: "G-FTCVFSMM4J"
};
// NOTE: No Firebase Storage is used anywhere in this app, by design (see spec §2, §138).

const fbApp = initializeApp(firebaseConfig); // initialized exactly once (§125)
const auth = getAuth(fbApp);
const db = getFirestore(fbApp);

const TAGLINE = "Smarter School Results. Better Academic Records.";
const ROLES = ["superAdmin","supportAdmin","owner","principal","vicePrincipal","registrar","teacher","printer","parent"];
const ROLE_LABELS = {
  superAdmin:"Super Admin", supportAdmin:"Support Admin", owner:"School Owner", principal:"Principal",
  vicePrincipal:"Vice Principal", registrar:"Registrar", teacher:"Teacher", printer:"Report Printer", parent:"Parent"
};
const SUBSCRIPTION_PRICE_DEFAULT = 10000; // NGN, configurable by Super Admin (§7)
const PAYMENT_DEFAULT = { method:"MoniePoint", accountName:"Wisdom Ebube Daniel", accountNumber:"9041498427" };

/* =====================================================================
   2. GLOBAL STATE
   ===================================================================== */
const State = {
  user: null,            // firebase auth user
  platformAdmin: null,   // platformAdmins/{uid} doc if any
  memberships: [],       // all schoolUsers docs for this uid
  activeSchoolId: null,  // currently selected school (multi-school support)
  activeSchool: null,    // schools/{id} doc
  activeMembership: null,// schoolUsers doc for activeSchoolId
  route: "loading",      // current view name
  routeParams: {},
  theme: localStorage.getItem("rx_theme") || "system",
  listeners: []          // active onSnapshot unsubscribers for the current view
};

function clearListeners(){ State.listeners.forEach(u=>{try{u()}catch(e){}}); State.listeners = []; }

/* =====================================================================
   3. PERMISSIONS
   Navigation and action-gating are derived from effective role(s).
   This is UX convenience only — Firestore Rules remain the real boundary (§91,§134).
   ===================================================================== */
function effectiveRole(){
  if (State.platformAdmin) return State.platformAdmin.level === "super" ? "superAdmin" : "supportAdmin";
  return State.activeMembership ? State.activeMembership.role : null;
}
function isAcademicAdmin(){
  const r = effectiveRole();
  return r === "principal" || r === "vicePrincipal" || (State.activeMembership && State.activeMembership.isPrincipal);
}
function isSchoolAdmin(){
  const r = effectiveRole();
  return r === "owner" || r === "principal" || (State.activeMembership && State.activeMembership.isOwner);
}
function can(action){
  const r = effectiveRole();
  const map = {
    approveSchools: ["superAdmin"],
    managePlatformSettings: ["superAdmin"],
    manageSupportAdmins: ["superAdmin"],
    manageBranding: ["owner","principal","superAdmin"],
    manageStaff: ["owner","principal","superAdmin"],
    manageStudents: ["registrar","principal","vicePrincipal","owner"],
    approveAssignments: ["principal","vicePrincipal"],
    assignTeachers: ["principal","vicePrincipal"],
    enterGrades: ["teacher"],
    reviewResults: ["principal","vicePrincipal"],
    lockResults: ["principal","vicePrincipal"],
    print: ["printer","principal","vicePrincipal","owner"],
    viewOwnChildren: ["parent"]
  };
  if (r === "superAdmin") return true;
  return (map[action]||[]).includes(r) || (action==="manageBranding"&&isSchoolAdmin()) ||
    (action==="approveAssignments"&&isAcademicAdmin()) || (action==="reviewResults"&&isAcademicAdmin()) ||
    (action==="lockResults"&&isAcademicAdmin());
}

/* =====================================================================
   4. FIRESTORE HELPERS
   ===================================================================== */
const col = (name)=>collection(db,name);
async function audit(action, extra={}){
  try{
    await addDoc(col("auditLogs"), {
      actorUid: State.user?.uid || null,
      actorRole: effectiveRole(),
      schoolId: State.activeSchoolId || extra.schoolId || null,
      action, ...extra, createdAt: serverTimestamp()
    });
  }catch(e){ /* never block UX on audit failure; log only */ console.warn("audit failed", e.message); }
}
async function notify(recipientUid, schoolId, title, body, link=""){
  try{
    await addDoc(col("notifications"), { recipientUid, schoolId, title, body, link, read:false, createdAt: serverTimestamp() });
  }catch(e){ console.warn("notify failed", e.message); }
}
function genReportId(){
  const bytes = new Uint8Array(16);
  crypto.getRandomValues(bytes);
  return Array.from(bytes).map(b=>b.toString(16).padStart(2,"0")).join("");
}
function genSchoolCode(){
  const chars="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let c=""; for(let i=0;i<6;i++) c+=chars[Math.floor(Math.random()*chars.length)];
  return "RX-"+c;
}

/* client-side image compression for logos/signatures/stamps (§28,§86,§139) */
function compressImage(file, maxDim=300, quality=0.72){
  return new Promise((resolve,reject)=>{
    if (!file.type.startsWith("image/")) return reject(new Error("Not an image"));
    if (file.size > 8*1024*1024) return reject(new Error("Image too large (max 8MB source)"));
    const img = new Image();
    const reader = new FileReader();
    reader.onload = e => { img.onload = ()=>{
      let {width,height} = img;
      if (width>height && width>maxDim){ height*=maxDim/width; width=maxDim; }
      else if (height>maxDim){ width*=maxDim/height; height=maxDim; }
      const canvas = document.createElement("canvas");
      canvas.width=width; canvas.height=height;
      canvas.getContext("2d").drawImage(img,0,0,width,height);
      const dataUrl = canvas.toDataURL("image/jpeg", quality);
      if (dataUrl.length > 350000) return reject(new Error("Compressed image still too large — pick a simpler image"));
      resolve(dataUrl);
    }; img.onerror=reject; img.src = e.target.result; };
    reader.onerror=reject;
    reader.readAsDataURL(file);
  });
}

/* =====================================================================
   5. UI UTILITIES
   ===================================================================== */
function toast(msg, kind="default"){
  const wrap = document.getElementById("toasts");
  const el = document.createElement("div");
  el.className = "toast"; el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(()=>el.remove(), 3600);
}
function el(tag, attrs={}, children=[]){
  const e = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs)){
    if (k==="class") e.className=v;
    else if (k==="html") e.innerHTML=v; // only used for trusted static fragments in this file
    else if (k.startsWith("on") && typeof v==="function") e.addEventListener(k.slice(2), v);
    else if (v!==false && v!==null && v!==undefined) e.setAttribute(k,v);
  }
  (Array.isArray(children)?children:[children]).forEach(c=>{
    if (c===null||c===undefined) return;
    e.appendChild(typeof c==="string" ? document.createTextNode(c) : c);
  });
  return e;
}
function fmtDate(ts){
  if (!ts) return "—";
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  return d.toLocaleDateString(undefined,{year:"numeric",month:"short",day:"numeric"});
}
function statusBadge(status){
  const map = {
    pending:"amber", active:"green", expiring:"amber", expired:"red", suspended:"red", rejected:"red",
    draft:"gray", submitted:"blue", approved:"green", locked:"green", voided:"red"
  };
  return el("span",{class:`badge ${map[status]||"gray"}`}, (status||"—").toUpperCase());
}
function modal(title, bodyEl, footerEl){
  const bg = el("div",{class:"modal-bg", onclick:(e)=>{ if(e.target===bg) bg.remove(); }});
  const m = el("div",{class:"modal"},[
    el("h3",{},title),
    bodyEl,
    footerEl || null
  ]);
  bg.appendChild(m);
  document.body.appendChild(bg);
  return bg;
}
function confirmAction(text, onConfirm){
  const footer = el("div",{style:"display:flex;gap:8px;justify-content:flex-end;margin-top:16px"});
  const bg = modal("Please confirm", el("p",{},text), footer);
  footer.appendChild(el("button",{class:"btn ghost", onclick:()=>bg.remove()},"Cancel"));
  footer.appendChild(el("button",{class:"btn danger", onclick:()=>{ bg.remove(); onConfirm(); }},"Confirm"));
}
function setTheme(t){
  State.theme = t; localStorage.setItem("rx_theme", t);
  const sys = window.matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.setAttribute("data-theme", t==="system" ? (sys?"dark":"light") : t);
}
setTheme(State.theme);

/* =====================================================================
   6. ROUTING
   ===================================================================== */
function navigate(route, params={}){
  clearListeners();
  State.route = route; State.routeParams = params;
  render();
}
window.addEventListener("hashchange", ()=>{
  const h = location.hash.replace("#","");
  if (h && h!==State.route) navigate(h);
});

/* =====================================================================
   7. AUTH FLOWS
   ===================================================================== */
async function loadUserContext(){
  const uSnap = await getDoc(doc(db,"platformAdmins", State.user.uid));
  State.platformAdmin = uSnap.exists() ? uSnap.data() : null;

  const q = query(col("schoolUsers"), where("uid","==",State.user.uid));
  const snap = await getDocs(q);
  State.memberships = snap.docs.map(d=>({id:d.id, ...d.data()}));

  if (State.platformAdmin){
    State.activeSchoolId = null; State.activeSchool = null; State.activeMembership = null;
    navigate("superAdminDashboard");
    return;
  }
  if (State.memberships.length === 0){
    navigate("noAccess");
    return;
  }
  await selectSchool(State.memberships[0].schoolId);
}
async function selectSchool(schoolId){
  State.activeSchoolId = schoolId;
  const [sSnap, mSnap] = await Promise.all([
    getDoc(doc(db,"schools",schoolId)),
    getDoc(doc(db,"schoolUsers", schoolId+"_"+State.user.uid))
  ]);
  State.activeSchool = sSnap.exists() ? {id:sSnap.id, ...sSnap.data()} : null;
  State.activeMembership = mSnap.exists() ? mSnap.data() : null;
  navigate(roleHomeRoute());
}
function roleHomeRoute(){
  const r = effectiveRole();
  const map = {
    superAdmin:"superAdminDashboard", supportAdmin:"superAdminDashboard",
    owner:"ownerDashboard", principal:"principalDashboard", vicePrincipal:"principalDashboard",
    registrar:"registrarDashboard", teacher:"teacherDashboard", printer:"printerDashboard", parent:"parentDashboard"
  };
  return map[r] || "noAccess";
}

onAuthStateChanged(auth, async (u)=>{
  State.user = u;
  if (!u){ State.platformAdmin=null; State.memberships=[]; State.activeSchoolId=null;
    State.activeSchool=null; State.activeMembership=null; navigate("login"); return; }
  navigate("loading");
  try{ await loadUserContext(); }
  catch(e){ console.error("Report X error:", e); toast(authErrorMessage(e)); navigate("login"); }
});

async function doLogin(email, password, btn){
  btn.disabled = true;
  try{ await signInWithEmailAndPassword(auth, email, password); }
  catch(e){ toast(authErrorMessage(e)); btn.disabled=false; }
}
async function doSignup(email, password, displayName, btn){
  btn.disabled = true;
  try{
    const cred = await createUserWithEmailAndPassword(auth, email, password);
    if (displayName) await updateProfile(cred.user, { displayName });
  } catch(e){ toast(authErrorMessage(e)); btn.disabled=false; }
}
function authErrorMessage(e){
  const map = {
    "auth/invalid-email":"That email address looks invalid.",
    "auth/user-not-found":"No account found with that email.",
    "auth/wrong-password":"Incorrect password.",
    "auth/invalid-credential":"Incorrect email or password.",
    "auth/email-already-in-use":"An account with that email already exists.",
    "auth/weak-password":"Password should be at least 6 characters.",
    "auth/network-request-failed":"Network error — check your connection.",
    "auth/operation-not-allowed":"Email/Password sign-in isn't enabled for this Firebase project yet (Firebase Console → Authentication → Sign-in method → enable Email/Password).",
    "auth/too-many-requests":"Too many attempts — please wait a moment and try again.",
    "permission-denied":"Permission denied by Firestore rules. Make sure the latest firestore.rules have been deployed to this exact project.",
    "unavailable":"Firestore is unreachable — check your connection, or that a Firestore Database has been created for this project."
  };
  if (map[e.code]) return map[e.code];
  // Surface the raw code/message instead of a generic string so real
  // misconfiguration (rules not deployed, auth provider off, wrong project, etc.) is visible.
  return (e.code ? `[${e.code}] ` : "") + (e.message || "Unknown error — check the browser console for details.");
}

   Invitation Code (§83: invitations are scoped, tied to a role/school,
   and never grant unrestricted access by themselves).

function genInviteCode(){
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let c = ""; for (let i=0;i<8;i++) c += chars[Math.floor(Math.random()*chars.length)];
  return c;
}
function viewRedeemInvite(){
  const wrap = el("div",{class:"center-screen"});
  const card = el("div",{class:"card auth-card"});
  const isLoggedIn = !!State.user;
  const schoolCode = el("input",{type:"text", placeholder:"e.g. RX-7K2M9P", style:"text-transform:uppercase"});
  const inviteCode = el("input",{type:"text", placeholder:"8-character invitation code", style:"text-transform:uppercase"});
  const nameField = el("input",{type:"text", placeholder:"Full name"});

  const btn = el("button",{class:"btn", style:"width:100%;margin-top:6px"}, isLoggedIn ? "Join School" : "Create Account & Join");
  btn.onclick = ()=>redeemInvite({
    schoolCode: schoolCode.value.trim().toUpperCase(),
    inviteCode: inviteCode.value.trim().toUpperCase(),
    name: nameField.value.trim(), email: email.value.trim(), password: pass.value
  }, btn, isLoggedIn);

  const fields = [
    el("div",{class:"field"},[el("label",{class:"req"},"School Code"), schoolCode]),
    el("div",{class:"field"},[el("label",{class:"req"},"Invitation Code"), inviteCode])
  ];
  if (!isLoggedIn){
    fields.push(el("div",{class:"field"},[el("label",{class:"req"},"Full Name"), nameField]));
    fields.push(el("div",{class:"field"},[el("label",{class:"req"},"Email"), email]));
    fields.push(el("div",{class:"field"},[el("label",{class:"req"},"Password"), pass]));

      el("p",{},"Join your school as a Teacher, Parent, or other invited staff using the codes your school gave you.")
    ]),
    ...fields,
    btn,
    el("div",{style:"text-align:center;margin-top:12px"}, el("a",{style:"font-size:12px;cursor:pointer", onclick:()=>navigate("login")}, "Back to sign in"))
  );

async function redeemInvite({schoolCode, inviteCode, name, email, password}, btn, isLoggedIn){
  if (!schoolCode || !inviteCode) return toast("Enter the school code and invitation code");
  if (!isLoggedIn && (!email || password.length<6)) return toast("Enter a valid email and a password of at least 6 characters");
  btn.disabled = true;
  try{
    const schoolSnap = await getDocs(query(col("schools"), where("schoolCode","==",schoolCode)));
    if (schoolSnap.empty){ toast("No school found with that code"); btn.disabled=false; return; }
    const school = { id: schoolSnap.docs[0].id, ...schoolSnap.docs[0].data() };

    const invSnap = await getDocs(query(col("schoolInvitations"),
      where("schoolId","==",school.id), where("code","==",inviteCode), where("used","==",false)));
    if (invSnap.empty){ toast("Invalid or already-used invitation code"); btn.disabled=false; return; }
    const invite = { id: invSnap.docs[0].id, ...invSnap.docs[0].data() };

    let user = State.user;
    if (!isLoggedIn){
      const cred = await createUserWithEmailAndPassword(auth, email, password);
      user = cred.user;
      if (name) await updateProfile(user, { displayName: name });
    }

    await updateDoc(doc(db,"schoolInvitations",invite.id), { used:true, consumedBy:user.uid, consumedAt: serverTimestamp() });
    await setDoc(doc(db,"schoolUsers", school.id+"_"+user.uid), {
      uid: user.uid, schoolId: school.id, role: invite.role, inviteId: invite.id,
      isOwner:false, isPrincipal:false, status:"active", email: user.email, createdAt: serverTimestamp()
    });
    await audit("invite.redeemed", { schoolId: school.id, targetType:"invitation", targetId: invite.id });
    toast(`Welcome! You've joined ${school.name} as ${ROLE_LABELS[invite.role]}.`);
    await loadUserContext();
  }catch(e){ console.error(e); toast(authErrorMessage(e)); btn.disabled=false; }
}

function viewRegisterSchool(){
  const wrap = el("div",{class:"center-screen"});
  const card = el("div",{class:"card", style:"max-width:520px;width:100%"});
  let step = 0;
  const data = { schoolName:"", address:"", phone:"", email:"", schoolType:"Primary & Secondary",
    motto:"", website:"", isOwner:true, ownerEmail:"", ownerPassword:"" };

  function stepInfo(){
    const f = (label,key,type="text",required=true)=>{
      const inp = el("input",{type, value:data[key]||"", oninput:e=>data[key]=e.target.value});
      return el("div",{class:"field"},[el("label",{class:required?"req":""},label), inp]);
    };
    return el("div",{},[
      el("h3",{},"1. School Information"),
      f("School Name","schoolName"), f("Address","address"), f("Phone","phone"),
      f("School Email","email","email"), f("School Type","schoolType"),
      f("Motto (optional)","motto","text",false), f("Website (optional)","website","text",false)
    ]);
  }
  function stepOwner(){
    const yesNo = el("select",{onchange:e=>data.isOwner = e.target.value==="yes"},[
      el("option",{value:"yes"},"Yes, I am the School Owner"),
      el("option",{value:"no"},"No, I'm registering on behalf of the school")
    ]);
    const em = el("input",{type:"email", value:data.ownerEmail, oninput:e=>data.ownerEmail=e.target.value});
    const pw = el("input",{type:"password", placeholder:"Choose a password (min 6 chars)", oninput:e=>data.ownerPassword=e.target.value});
    return el("div",{},[
      el("h3",{},"2. Owner Account"),
      el("div",{class:"field"},[el("label",{},"Is the registrant the School Owner?"), yesNo]),
      el("div",{class:"field"},[el("label",{class:"req"},"Your Account Email"), em]),
      el("div",{class:"field"},[el("label",{class:"req"},"Password"), pw]),
      el("p",{class:"help"},"Your school will enter a pending state until the Super Admin approves your registration and payment.")
    ]);
  }
  function stepReview(){
    return el("div",{},[
      el("h3",{},"3. Review & Submit"),
      el("p",{},`${data.schoolName} — ${data.schoolType}`),
      el("p",{},data.address),
      el("p",{class:"help"},"After submitting, you'll receive a unique school code and can proceed to payment for Super Admin review.")
    ]);
  }

  const dots = el("div",{class:"step-dots"});
  const body = el("div",{});
  const nav = el("div",{style:"display:flex;justify-content:space-between;margin-top:14px"});

  function renderStep(){
    dots.innerHTML=""; for(let i=0;i<3;i++) dots.appendChild(el("span",{class:i<=step?"done":""}));
    body.innerHTML=""; body.appendChild([stepInfo,stepOwner,stepReview][step]());
    nav.innerHTML="";
    const back = el("button",{class:"btn ghost", onclick:()=>{ if(step>0){step--; renderStep();} else navigate("login"); }}, step===0?"Cancel":"Back");
    const next = el("button",{class:"btn", onclick: async ()=>{
      if (step===0 && !data.schoolName){ toast("School name required"); return; }
      if (step===1 && (!data.ownerEmail || data.ownerPassword.length<6)){ toast("Valid email + 6-char password required"); return; }
      if (step<2){ step++; renderStep(); return; }
      next.disabled = true;
      try{
        const cred = await createUserWithEmailAndPassword(auth, data.ownerEmail.trim(), data.ownerPassword);
        const schoolCode = genSchoolCode();
        const schoolRef = await addDoc(col("schools"), {
          name: data.schoolName, address: data.address, phone: data.phone, email: data.email,
          schoolType: data.schoolType, motto: data.motto, website: data.website,
          schoolCode, subscriptionStatus: "pending", subscriptionPrice: SUBSCRIPTION_PRICE_DEFAULT,
          subscriptionExpiresAt: null, createdAt: serverTimestamp(), createdBy: cred.user.uid
        });
        await setDoc(doc(db,"schoolUsers", schoolRef.id+"_"+cred.user.uid), {
          uid: cred.user.uid, schoolId: schoolRef.id, role: "owner", isOwner: true,
          isPrincipal: false, status: "active", email: data.ownerEmail, createdAt: serverTimestamp()
        });
        await audit("school.registered", { schoolId: schoolRef.id });
        toast(`School registered! Your code is ${schoolCode}`);
      }catch(e){ toast(authErrorMessage(e)); next.disabled=false; }
    }}, step===2?"Submit Registration":"Next");
    nav.append(back, next);
  }
  renderStep();
  card.append(el("div",{class:"topbar brand", style:"border:none;padding:0 0 12px;font-size:20px"},"Report X — School Registration"), dots, body, nav);
  wrap.appendChild(card);
  return wrap;
}

  const [studSnap, subSnap, pendingSnap] = await Promise.all([
    getDocs(query(col("students"), where("schoolId","==",schoolId))),
    getDocs(query(col("results"), where("schoolId","==",schoolId), where("status","==","submitted"))),
    getDocs(query(col("studentClassAssignments"), where("schoolId","==",schoolId), where("approved","==",false)))
  ]);
  [["Students",studSnap.size],["Pending Approvals",pendingSnap.size],["Submitted Results",subSnap.size],["Subscription",""]]
    .forEach(([l,n])=> grid.appendChild(el("div",{class:"card stat"},[
      l==="Subscription"?statusBadge(State.activeSchool?.subscriptionStatus):el("div",{class:"num"},String(n)),
      el("div",{class:"lbl"},l)
    ])));

  return shell(content);
}

/* =====================================================================
   12b. STAFF & INVITATIONS (§13 access gate, §83)
   Owner/Principal generate a one-time School Code + Invitation Code pair;
   Teachers/Parents/etc. redeem it from the "Have an invite code?" link on
   the sign-in screen (see viewRedeemInvite above).
   ===================================================================== */
async function viewStaff(){
  const schoolId = State.activeSchoolId;
  const content = el("div");
  content.appendChild(el("h2",{},"Staff & Invitations"));
  content.appendChild(el("p",{},"Generate a code for a Teacher, Parent, Registrar, Vice Principal, or Printer to join your school. Share your School Code and their Invitation Code — they redeem both from the “Have an invite code?” link on the sign-in screen."));

  const roleSel = el("select",{}, ["teacher","parent","registrar","vicePrincipal","printer","principal"].map(r=>el("option",{value:r}, ROLE_LABELS[r])));
  const genBtn = el("button",{class:"btn sm", onclick:()=>generateInvite()},"Generate Code");
  content.appendChild(el("div",{class:"card", style:"display:flex;gap:14px;align-items:end;flex-wrap:wrap"},[
    el("div",{class:"field", style:"margin:0"},[el("label",{},"Role"), roleSel]),
    genBtn,
    el("div",{class:"field", style:"margin:0"},[el("label",{},"Your School Code (share this too)"),
      el("div",{style:"font-weight:800;font-size:18px;letter-spacing:.03em"}, State.activeSchool?.schoolCode||"—")])
  ]));

  const listWrap = el("div",{style:"margin-top:14px"});
  content.appendChild(listWrap);

  async function loadInvites(){
    listWrap.innerHTML = "";
    listWrap.appendChild(el("div",{class:"skeleton",style:"height:100px"}));
    const snap = await getDocs(query(col("schoolInvitations"), where("schoolId","==",schoolId), orderBy("createdAt","desc"), limit(30)));
    const invites = snap.docs.map(d=>({id:d.id,...d.data()}));
    listWrap.innerHTML = "";
    if (!invites.length){
      listWrap.appendChild(el("div",{class:"empty"},[el("div",{class:"big"},"👥"), el("p",{},"No invitations generated yet.")]));
      return;
    }
    const tw = el("div",{class:"card table-wrap"});
    tw.appendChild(el("table",{},[
      el("thead",{},el("tr",{},["Role","Code","Status","Created",""].map(h=>el("th",{},h)))),
      el("tbody",{}, invites.map(i=>el("tr",{},[
        el("td",{}, ROLE_LABELS[i.role]||i.role),
        el("td",{style:"font-family:monospace;font-weight:700"}, i.code),
        el("td",{}, i.used ? el("span",{class:"badge green"},"REDEEMED") : el("span",{class:"badge amber"},"PENDING")),
        el("td",{}, fmtDate(i.createdAt)),
        el("td",{}, !i.used ? el("button",{class:"btn sm danger", onclick:()=>revokeInvite(i.id)},"Revoke") : null)
      ])))
    ]));
    listWrap.appendChild(tw);
  }
  async function generateInvite(){
    genBtn.disabled = true;
    try{
      const code = genInviteCode();
      await addDoc(col("schoolInvitations"), { schoolId, role: roleSel.value, code, used:false, createdAt: serverTimestamp(), createdBy: State.user.uid });
      await audit("invite.created", { schoolId, targetType:"invitation" });
      toast(`Code generated: ${code}`);
      await loadInvites();
    }catch(e){ toast(authErrorMessage(e)); }
    genBtn.disabled = false;
  }
  async function revokeInvite(id){
    confirmAction("Revoke this invitation code? It can no longer be redeemed.", async ()=>{
      await deleteDoc(doc(db,"schoolInvitations",id));
      await audit("invite.revoked", { schoolId, targetType:"invitation", targetId:id });
      toast("Invitation revoked");
      await loadInvites();
    });
  }
  await loadInvites();
  return shell(content);
}

/* =====================================================================
   13. STUDENTS (Registrar workflow: create -> assign -> Principal approves) (§13,§58)
   ===================================================================== */
async function viewStudents(){
  const schoolId = State.activeSchoolId;
  const content = el("div");
  const header = el("div",{style:"display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"},[
    el("h2",{},"Students"),
    can("manageStudents") ? el("button",{class:"btn", onclick:()=>openAddStudent()},"+ Add Student") : null
  ]);
  content.appendChild(header);
  const tw = el("div",{class:"card table-wrap"},[el("div",{class:"skeleton",style:"height:160px"})]);
  content.appendChild(tw);

  const snap = await getDocs(query(col("students"), where("schoolId","==",schoolId), orderBy("createdAt","desc"), limit(100)));
  const students = snap.docs.map(d=>({id:d.id,...d.data()}));
  tw.innerHTML="";
  if (!students.length){
    tw.appendChild(el("div",{class:"empty"},[el("div",{class:"big"},"🎓"),el("p",{},"No students yet."),
      can("manageStudents")?el("button",{class:"btn sm",onclick:()=>openAddStudent()},"Add your first student"):null]));
  } else {
    tw.appendChild(el("table",{},[
      el("thead",{},el("tr",{},["Name","Admission No.","Class","Gender",""].map(h=>el("th",{},h)))),
      el("tbody",{}, students.map(s=>el("tr",{},[
        el("td",{},`${s.firstName||""} ${s.lastName||""}`), el("td",{},s.admissionNumber||"—"),
        el("td",{},s.className||"Unassigned"), el("td",{},s.gender||"—"),
        el("td",{},el("button",{class:"btn sm secondary",onclick:()=>navigate("studentDetail",{id:s.id})},"View"))
      ])))
    ]));
  }
  return shell(content);
}
function openAddStudent(){
  const first = el("input",{type:"text"}); const last = el("input",{type:"text"});
  const adm = el("input",{type:"text"}); const gender = el("select",{},[el("option",{},"Male"),el("option",{},"Female")]);
  const dob = el("input",{type:"date"}); const parentName = el("input",{type:"text"});
  const parentEmail = el("input",{type:"email"}); const parentPhone = el("input",{type:"tel"});
  const body = el("div",{},[
    el("div",{class:"grid grid-2"},[
      el("div",{class:"field"},[el("label",{class:"req"},"First Name"), first]),
      el("div",{class:"field"},[el("label",{class:"req"},"Last Name"), last]),
      el("div",{class:"field"},[el("label",{class:"req"},"Admission Number"), adm]),
      el("div",{class:"field"},[el("label",{},"Gender"), gender]),
      el("div",{class:"field"},[el("label",{},"Date of Birth"), dob]),
      el("div",{class:"field"},[el("label",{},"Parent Name"), parentName]),
      el("div",{class:"field"},[el("label",{},"Parent Email"), parentEmail]),
      el("div",{class:"field"},[el("label",{},"Parent Phone"), parentPhone]),
    ])
  ]);
  const footer = el("div",{style:"display:flex;gap:8px;justify-content:flex-end"});
  const bg = modal("Add Student", body, footer);
  footer.appendChild(el("button",{class:"btn ghost", onclick:()=>bg.remove()},"Cancel"));
  footer.appendChild(el("button",{class:"btn", onclick: async (e)=>{
    if (!first.value || !last.value || !adm.value) return toast("Name and admission number are required");
    e.target.disabled = true;
    try{
      const dupe = await getDocs(query(col("students"), where("schoolId","==",State.activeSchoolId), where("admissionNumber","==",adm.value)));
      if (!dupe.empty){ toast("Admission number already exists"); e.target.disabled=false; return; }
      const ref = await addDoc(col("students"), {
        schoolId: State.activeSchoolId, firstName:first.value, lastName:last.value, admissionNumber:adm.value,
        gender: gender.value, dob: dob.value||null, parentName: parentName.value, parentEmail: parentEmail.value,
        parentPhone: parentPhone.value, className: null, status:"active", createdAt: serverTimestamp(), createdBy: State.user.uid
      });
      await audit("student.created", { schoolId: State.activeSchoolId, targetType:"student", targetId: ref.id });
      toast("Student added"); bg.remove(); navigate("students");
    }catch(err){ toast("Failed: "+err.message); e.target.disabled=false; }
  }},"Add Student"));
}

/* =====================================================================
   14. TEACHER — GRADE ENTRY (§14,§62)
   ===================================================================== */
async function viewGradeEntry(){
  const content = el("div",{},[el("h2",{},"Grade Entry"), el("p",{},"Select a class and subject you're assigned to.")]);
  const schoolId = State.activeSchoolId;
  const asnSnap = await getDocs(query(col("teacherAssignments"), where("schoolId","==",schoolId), where("teacherUid","==",State.user.uid)));
  const assignments = asnSnap.docs.map(d=>({id:d.id,...d.data()}));
  if (!assignments.length){
    content.appendChild(el("div",{class:"empty"},[el("div",{class:"big"},"✏️"),el("p",{},"You have no class/subject assignments yet. Ask your Principal to assign you.")]));
    return shell(content);
  }
  const sel = el("select",{}, assignments.map(a=>el("option",{value:a.id}, `${a.className} — ${a.subjectName}`)));
  const loadBtn = el("button",{class:"btn sm", onclick:()=>loadRoster(assignments.find(a=>a.id===sel.value))},"Load Class");
  content.appendChild(el("div",{class:"card", style:"display:flex;gap:10px;align-items:end;flex-wrap:wrap"},[
    el("div",{class:"field", style:"margin:0"},[el("label",{},"Class / Subject"), sel]), loadBtn
  ]));
  const rosterWrap = el("div",{style:"margin-top:14px"});
  content.appendChild(rosterWrap);

  async function loadRoster(assignment){
    rosterWrap.innerHTML = ""; rosterWrap.appendChild(el("div",{class:"skeleton",style:"height:140px"}));
    const stSnap = await getDocs(query(col("studentClassAssignments"), where("schoolId","==",schoolId),
      where("classId","==",assignment.classId), where("approved","==",true)));
    const studentIds = stSnap.docs.map(d=>d.data().studentId);
    rosterWrap.innerHTML = "";
    if (!studentIds.length){
      rosterWrap.appendChild(el("div",{class:"empty"},[el("p",{},"No approved students in this class yet.")]));
      return;
    }
    const tw = el("div",{class:"card table-wrap"});
    const rows = [];
    for (const sid of studentIds){
      const sSnap = await getDoc(doc(db,"students",sid));
      if (!sSnap.exists()) continue;
      const s = sSnap.data();
      const ca = el("input",{type:"number", min:0, max:30, placeholder:"CA", style:"width:70px"});
      const exam = el("input",{type:"number", min:0, max:70, placeholder:"Exam", style:"width:70px"});
      rows.push({ studentId: sid, name:`${s.firstName} ${s.lastName}`, ca, exam });
    }
    tw.appendChild(el("table",{},[
      el("thead",{},el("tr",{},["Student","CA (30)","Exam (70)"].map(h=>el("th",{},h)))),
      el("tbody",{}, rows.map(r=>el("tr",{},[el("td",{},r.name), el("td",{},r.ca), el("td",{},r.exam)])))
    ]));
    const saveDraft = el("button",{class:"btn secondary sm", onclick:()=>saveResults(assignment, rows, "draft")},"Save Draft");
    const submit = el("button",{class:"btn sm", onclick:()=>saveResults(assignment, rows, "submitted")},"Submit for Approval");
    rosterWrap.append(tw, el("div",{style:"display:flex;gap:8px;margin-top:10px"},[saveDraft, submit]));
  }
  async function saveResults(assignment, rows, status){
    try{
      const batch = writeBatch(db);
      rows.forEach(r=>{
        const ca = Number(r.ca.value||0), exam = Number(r.exam.value||0);
        const ref = doc(col("results"));
        batch.set(ref, {
          schoolId, classId: assignment.classId, subjectId: assignment.subjectId, studentId: r.studentId,
          teacherUid: State.user.uid, ca, exam, total: ca+exam, status, createdAt: serverTimestamp()
        });
      });
      await batch.commit();
      await audit("results."+status, { schoolId, targetType:"class", targetId: assignment.classId });
      toast(status==="submitted" ? "Results submitted for approval" : "Draft saved");
    }catch(e){ toast("Save failed: "+e.message); }
  }
  return shell(content);
}

/* =====================================================================
   15. PRINCIPAL — RESULT REVIEW (§20,§63)
   ===================================================================== */
async function viewReviewResults(){
  const content = el("div",{},[el("h2",{},"Result Approvals")]);
  const snap = await getDocs(query(col("results"), where("schoolId","==",State.activeSchoolId), where("status","==","submitted")));
  const results = snap.docs.map(d=>({id:d.id,...d.data()}));
  const tw = el("div",{class:"card table-wrap"});
  if (!results.length){
    tw.appendChild(el("div",{class:"empty"},[el("div",{class:"big"},"✅"),el("p",{},"No submitted results awaiting review.")]));
  } else {
    tw.appendChild(el("table",{},[
      el("thead",{},el("tr",{},["Student","Total","Actions"].map(h=>el("th",{},h)))),
      el("tbody",{}, results.map(r=>el("tr",{},[
        el("td",{},r.studentId), el("td",{},String(r.total)),
        el("td",{},[
          el("button",{class:"btn sm", onclick:()=>decideResult(r.id,"approved")},"Approve"),
          document.createTextNode(" "),
          el("button",{class:"btn sm danger", onclick:()=>decideResult(r.id,"rejected")},"Reject")
        ])
      ])))
    ]));
  }
  content.appendChild(tw);
  return shell(content);
}
async function decideResult(resultId, decision){
  let reason = "";
  if (decision==="rejected"){ reason = prompt("Reason for rejection (required):") || ""; if (!reason.trim()) return toast("A rejection reason is required"); }
  await updateDoc(doc(db,"results",resultId), { status: decision, reviewedBy: State.user.uid, reviewedAt: serverTimestamp(), rejectionReason: reason||null });
  await audit("results."+decision, { schoolId: State.activeSchoolId, targetType:"result", targetId: resultId, reason });
  toast("Result "+decision); navigate("reviewResults");
}

/* =====================================================================
   16. REPORT CARD ENGINE + QR VERIFICATION (§22-§24,§96-§98,§120-§122)
   ===================================================================== */
async function finalizeReportCard(studentId, classId, sessionId, termId){
  // Authoritative recalculation from locked results only (§95,§163)
  const rSnap = await getDocs(query(col("results"), where("schoolId","==",State.activeSchoolId),
    where("studentId","==",studentId), where("status","==","locked")));
  const results = rSnap.docs.map(d=>d.data());
  const total = results.reduce((a,r)=>a+(r.total||0),0);
  const reportId = genReportId();
  const ref = await addDoc(col("reportCards"), {
    schoolId: State.activeSchoolId, studentId, classId, sessionId, termId, reportId,
    subjects: results.map(r=>({subjectId:r.subjectId, ca:r.ca, exam:r.exam, total:r.total})),
    overallTotal: total, status: "final", createdAt: serverTimestamp(), createdBy: State.user.uid
  });
  await setDoc(doc(db,"reportVerification",reportId), {
    schoolId: State.activeSchoolId, studentId, reportCardId: ref.id, valid: true, createdAt: serverTimestamp()
  });
  await audit("report.finalized", { schoolId: State.activeSchoolId, targetType:"reportCard", targetId: ref.id });
  return ref.id;
}
function renderQR(container, url){
  container.innerHTML = "";
  // eslint-disable-next-line no-undef
  new QRCode(container, { text: url, width: 96, height: 96 });
}
async function viewPublicVerify(token){
  const content = el("div",{class:"center-screen"});
  const card = el("div",{class:"card", style:"max-width:420px;width:100%;text-align:center"});
  card.appendChild(el("h3",{},"Verifying report…"));
  content.appendChild(card);
  try{
    const snap = await getDoc(doc(db,"reportVerification",token));
    card.innerHTML = "";
    if (!snap.exists()){
      card.append(el("div",{class:"big"},"❌"), el("h3",{},"Not Found"), el("p",{},"No report matches this verification code."));
    } else {
      const v = snap.data();
      const schoolSnap = await getDoc(doc(db,"schools",v.schoolId));
      const studentSnap = await getDoc(doc(db,"students",v.studentId));
      const valid = v.valid !== false;
      card.append(
        el("div",{class:"big"}, valid?"✅":"⛔"),
        el("h3",{}, valid?"VALID REPORT":"VOID / INVALID"),
        el("p",{}, schoolSnap.exists()?schoolSnap.data().name:"—"),
        el("p",{}, studentSnap.exists()?`${studentSnap.data().firstName} ${studentSnap.data().lastName}`:"—"),
        el("p",{class:"help"}, "Report ID: "+token)
      );
    }
  }catch(e){ card.innerHTML=""; card.append(el("p",{},"Verification failed. Please try again.")); }
  return content;
}

}

  branding: ()=>scaffoldView("School Branding","Logo, motto, official signature/stamp, report colors, and template settings (compressed client-side, no Storage used)."),
  staff: viewStaff,
  redeemInvite: viewRedeemInvite,
  subscription: ()=>scaffoldView("Subscription","View status and submit payment proof for Super Admin review.")
};
async function render(){
  const appRoot = document.getElementById("app");
  appRoot.innerHTML = "";
  try{
    const view = routes[State.route] || (()=>scaffoldView("Not Found"));
    const result = await view(State.routeParams);
    appRoot.appendChild(result);
  }catch(e){
    console.error("Report X render error:", e);
    appRoot.appendChild(el("div",{class:"center-screen"},[
      el("div",{class:"card", style:"text-align:center;max-width:420px"},[
        el("h3",{},"Something went wrong"),
        el("p",{}, authErrorMessage(e)),
        el("p",{class:"help"},"Open the browser console (F12) for the full technical error."),
        el("button",{class:"btn", onclick:()=>navigate(roleHomeRoute())},"Go Home")
      ])
    ]));
  }
}

/* Public verification deep link: #verify/{token} (no auth required) */
(function bootRoute(){
  const h = location.hash.replace("#","");
  if (h.startsWith("verify/")){
    const token = h.split("/")[1];
    document.getElementById("app").appendChild(el("div"));
    viewPublicVerify(token).then(v=>{ document.getElementById("app").innerHTML=""; document.getElementById("app").appendChild(v); });
    return;
  }
})();

/* Register service worker (PWA) */
if ("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{ navigator.serviceWorker.register("sw.js").catch(()=>{}); });
}
